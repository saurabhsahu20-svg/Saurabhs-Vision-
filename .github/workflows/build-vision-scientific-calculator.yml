name: Build VISION CALC Scientific Calculator APK

on:
  push:
    branches: [main]
    paths:
      - 'vision-scientific-calculator/**'
      - '.github/workflows/build-vision-scientific-calculator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vision-calc-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test scientific maths and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Validate real app, offline permissions and Android source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vision-scientific-calculator')
          manifest=(p/'app/src/main/AndroidManifest.xml').read_text()
          source=(p/'app/src/main/java/com/saurabhsvision/visioncalc/MainActivity.java').read_text()
          engine=(p/'app/src/main/java/com/saurabhsvision/visioncalc/ExpressionEngine.java').read_text()
          converter=(p/'app/src/main/java/com/saurabhsvision/visioncalc/UnitConverter.java').read_text()
          for forbidden in ('android.permission.INTERNET','READ_CONTACTS','RECORD_AUDIO',
                            'ACCESS_FINE_LOCATION','READ_EXTERNAL_STORAGE'):
              assert forbidden not in manifest, forbidden
          assert 'allowBackup="false"' in manifest
          assert 'extends Activity' in source
          for item in ('UNIT CONVERTER','RECENT CALCULATIONS','sin','log','factorial',
                       'history','memory','ClipboardManager','DEG','RAD'):
              assert item in source or item in engine, item
          assert 'UnitConverter.count()' in source or 'UnitConverter.names()' in source
          assert 'versionName \'1.3.0\'' in (p/'app/build.gradle').read_text()
          # The visual reference demands a four-column keypad with real maths.
          assert 'String[][] rows={' in source
          for row in ('{"AC","()","%","÷"}', '{"7","8","9","×"}',
                      '{"4","5","6","−"}', '{"1","2","3","+"}',
                      '{"0",".","⌫","="}'):
              assert row in source, row
          for feature in ('numericKey(', 'scientificOpen','darkMode',
                          'getDisplayMetrics().heightPixels','recentResult()',
                          'ScrollView','setFillViewport(true)',
                          'new LinearLayout.LayoutParams(-1,-2)',
                          'CALCULATE SMART','SCIENTIFIC TOOLS',
                          'Tap to switch','showTab();'):
              assert feature in source, feature
          assert 'View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR' in source
          assert 'View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR' in source
          assert 'case "()":' in source
          assert 'case ",":' in source
          assert 'case "π":case "e":' in source
          assert 'new LinearLayout.LayoutParams(-1,0,1f)' not in source
          assert 'scientificChip(token)' in source
          assert 'scienceGrid.addView(row' in source
          assert 'dp(50)' in source
          assert 'keypadRows.add(row)' in source
          assert 'keypadFooter=footer' in source
          assert 'expandKeypadToViewport()' in source
          assert 'CalculatorLayoutPolicy.extraPerKeyRow(' in source
          assert 'getSystemWindowInsetTop()' in source
          assert 'getSystemWindowInsetBottom()' in source
          assert (p/'app/src/main/java/com/saurabhsvision/visioncalc/CalculatorLayoutPolicy.java').is_file()
          print('PASS: colorful science grid and adaptive numeric keypad consume unused height')
          print('PASS: screenshot-inspired four-column design and functioning controls')
          assert 'Math.pow' in engine and 'Math.sin' in engine
          assert 'Temperature' in converter and 'Frequency' in converter
          assert (p/'app/src/main/res/drawable-nodpi/ic_s_calc.webp').is_file()
          icon=(p/'app/src/main/res/drawable-nodpi/ic_s_calc.webp').read_bytes()
          assert icon[:4]==b'RIFF' and icon[8:12]==b'WEBP' and len(icon)>4000
          assert 'android:icon="@drawable/ic_s_calc"' in manifest
          assert 'android:roundIcon="@drawable/ic_s_calc"' in manifest
          assert 'icon.setImageResource(R.drawable.ic_s_calc);' in source
          assert 'TextView logoName=text("S VISION"' in source
          assert 'monogram.setContentDescription("S Vision logo")' in source
          print('PASS: Premium S-CALC icon is used by launcher and S VISION branding appears inside calculator')
          print('PASS: VISION CALC native Android app and permission-free offline code')
          PY

      - name: Compile and accuracy-test the Java calculation engine
        shell: bash
        run: |
          set -euo pipefail
          p="vision-scientific-calculator"
          src="$p/app/src/main/java/com/saurabhsvision/visioncalc"
          out="$RUNNER_TEMP/vision-calc-core"
          mkdir -p "$out"
          javac -encoding UTF-8 -d "$out" \
            "$src/ExpressionEngine.java" \
            "$src/UnitConverter.java" \
            "$p/tests/CalculatorCoreTest.java"
          java -ea -cp "$out" CalculatorCoreTest

      - name: Test responsive keypad sizing on tall and short screens
        shell: bash
        run: |
          set -euo pipefail
          p="vision-scientific-calculator"
          src="$p/app/src/main/java/com/saurabhsvision/visioncalc"
          out="$RUNNER_TEMP/vision-calc-layout"
          mkdir -p "$out"
          javac -encoding UTF-8 -d "$out" \
            "$src/CalculatorLayoutPolicy.java" \
            "$p/tests/CalculatorLayoutPolicyTest.java"
          java -ea -cp "$out" CalculatorLayoutPolicyTest

      - name: Compile real Android APK
        shell: bash
        run: |
          cd vision-scientific-calculator
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK package and debug signature
        shell: bash
        run: |
          set -euo pipefail
          apk="vision-scientific-calculator/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.saurabhsvision.visioncalc'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q MainActivity
          mkdir -p calc-deliverables
          cp "$apk" calc-deliverables/VISION_CALC_v1.3.0_S_CALC_ICON.apk
          ( cd calc-deliverables && sha256sum *.apk > SHA256SUMS.txt )

      - name: Upload downloadable calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: VISION_CALC_v1_3_0_S_CALC_ICON_APK
          path: calc-deliverables/*
          retention-days: 90

      - name: Publish public GitHub test APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="vision-calc-v1.3.0"
          apk="calc-deliverables/VISION_CALC_v1.3.0_S_CALC_ICON.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" calc-deliverables/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "$apk" calc-deliverables/SHA256SUMS.txt \
              --title "VISION CALC 1.3 • S CALC Neon App Icon + S VISION Logo" \
              --notes "VISION CALC v1.3 by SAURABH'S VISION: updates both Android launcher icon and in-app header to the user-approved glossy S ribbon with CALC lettering and four bright operator keys, cropped to the requested motif. Adds a compact branded S VISION monogram inside the calculator result display; the rest of the premium scientific UI and all calculations are unchanged. Maintains both light/dark modes, 4-column numeric keypad, scientific tools, history and 12 converters. GitHub CI tests the new WebP icon, Android manifest branding, scientific accuracy, responsive layout, APK compilation and signing. This is a debug-signed test APK; physically confirm launcher crop on phone." \
              --latest=false
          fi
