name: Publish Saurabh Vision Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: saurabhs-vision-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish public website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate public website before publishing
        shell: bash
        run: |
          set -euo pipefail
          node --check website/app.js
          node --check website/service-worker.js
          node --check website/firebase-service.js
          python3 website/tests/smoke.py
          grep -q 'wa.me/918085808586' website/app.js
          grep -q 'Parent / guardian' website/app.js
      - name: Test mobile, admission, quiz and study tools in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website/tests install --no-save --no-audit --no-fund playwright@1.56.1
          python3 -m http.server 8765 --bind 127.0.0.1 --directory website >/tmp/sv-website-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node website/tests/browser_smoke.mjs
      - name: Create static publish directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saurabh-site"
          cp -a website/. "$RUNNER_TEMP/saurabh-site/"
          # Publish only public frontend; do not host backend logic or policies.
          rm -rf "$RUNNER_TEMP/saurabh-site/functions" \
                 "$RUNNER_TEMP/saurabh-site/tests" \
                 "$RUNNER_TEMP/saurabh-site/APP_IMPORT_GUIDE.md" \
                 "$RUNNER_TEMP/saurabh-site/APP_IMPORT_TEST_REPORT.md" \
                 "$RUNNER_TEMP/saurabh-site/firestore.rules" \
                 "$RUNNER_TEMP/saurabh-site/storage.rules" \
                 "$RUNNER_TEMP/saurabh-site/firestore.indexes.json" \
                 "$RUNNER_TEMP/saurabh-site/firebase.json"
          # Extract the publicly committed owner app's web learning material.
          # This avoids republishing APK binaries or private Android account data.
          python3 - <<'PY'
          import json, os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          apk = Path('Saurabh_Vision_Quiz_Club_Test (4).apk')
          if not apk.exists():
              raise SystemExit('App content APK is missing; refusing incomplete public release.')
          root = Path(os.environ['RUNNER_TEMP']) / 'saurabh-site' / 'vision-app'
          allowed = {'.html','.css','.js','.json','.png','.jpg','.jpeg','.svg','.webp','.webmanifest','.txt'}
          count = 0
          with ZipFile(apk) as archive:
              for member in archive.infolist():
                  if member.is_dir() or not member.filename.startswith('assets/www/'):
                      continue
                  rel = member.filename[len('assets/www/'):]
                  p = PurePosixPath(rel)
                  if not rel or rel.startswith('/') or '..' in p.parts or '\\' in rel:
                      raise SystemExit('Unsafe application archive path')
                  if p.suffix.lower() not in allowed or 'fonts' in p.parts:
                      continue
                  dest = root.joinpath(*p.parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with archive.open(member) as inp, dest.open('wb') as out:
                      out.write(inp.read())
                  count += 1
          if not (root/'index.html').exists():
              raise SystemExit('App did not contain web entrypoint')
          samples=list(root.rglob('*.json'))
          if samples:
              json.loads(samples[0].read_text(encoding='utf-8'))
          # Discover the new shared Study Sprint from the imported Android app menu.
          # The feature page is hosted at ../study-sprint/ and does not collect account data.
          mobile = root / 'mobile.js'
          if mobile.exists():
              old = mobile.read_text(encoding='utf-8')
              marker = '<div class="more-list"><a class="chapter-entry" href="platform/index.html">'
              card = '<a class="chapter-entry" href="../study-sprint/index.html"><span aria-hidden="true">🎯</span><div><strong>Daily Study Sprint · NEW</strong><small>5 quick questions with explanations</small></div><span aria-hidden="true">→</span></a>'
              if old.count(marker) == 1 and 'Daily Study Sprint · NEW' not in old:
                  mobile.write_text(old.replace(marker, '<div class="more-list">'+card+'<a class="chapter-entry" href="platform/index.html">'),encoding='utf-8')
                  print('Added Study Sprint to web app learning menu')
              else:
                  # Older APKs use a different menu layout; provide an always-visible
                  # link without changing their existing quiz/learning JavaScript.
                  page = root / 'index.html'
                  if page.exists():
                      body = page.read_text(encoding='utf-8')
                      if '../study-sprint/index.html' not in body and '</body>' in body:
                          badge = '<a href="../study-sprint/index.html" aria-label="Daily Study Sprint" style="position:fixed;bottom:88px;right:12px;z-index:990;background:#ffd700;color:#071b49;text-decoration:none;padding:10px 14px;border-radius:24px;box-shadow:0 5px 18px #071b4955;font:800 13px system-ui">🎯 Daily Sprint</a>'
                          page.write_text(body.replace('</body>',badge+'</body>'),encoding='utf-8')
                          print('Added Study Sprint shortcut to hosted learning app')
                      else:
                          print('Study Sprint shortcut already present or incompatible HTML')
          # Add a visible public CGBSE teacher guide entry to the hosted APK web assets.
          # This modifies the GitHub Pages web copy only, not the downloadable Android APK.
          app_landing = root / 'index.html'
          if app_landing.exists():
              html = app_landing.read_text(encoding='utf-8')
              if '../cgbse-solutions/' not in html and '</body>' in html:
                  teacher_link = '<a href="../cgbse-solutions/" aria-label="CGBSE Class 10 and 12 teacher guides" style="position:fixed;bottom:138px;right:12px;z-index:989;background:#ffe16a;color:#071b49;text-decoration:none;padding:10px 14px;border-radius:24px;box-shadow:0 4px 15px #071b4940;font:800 12px system-ui">📚 CGBSE 10 / 12 Solutions</a>'
                  app_landing.write_text(html.replace('</body>', teacher_link + '</body>'), encoding='utf-8')
                  print('Linked CGBSE reader from hosted learning web app')
          print('Imported', count, 'public website app files including',len(samples),'JSON assets')
          PY
          # Publish all CGBSE question-and-answer PDFs from the public release asset.
          # No visitor uploads or ZIP-picker UI: each set is a direct static PDF.
          RELEASE_TAG="cgbse-2026-27"
          PDF_ARCHIVE="CGBSE_2026_27_All_1050_PDF_Booklets.zip"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$PDF_ARCHIVE" --dir "$RUNNER_TEMP"
            python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path(os.environ['RUNNER_TEMP']) / "CGBSE_2026_27_All_1050_PDF_Booklets.zip"
          dest = Path(os.environ['RUNNER_TEMP']) / 'saurabh-site' / 'cgbse-solutions' / 'pdfs'
          if not archive.exists():
              raise SystemExit('Missing full PDF archive release asset')
          with ZipFile(archive) as z:
              members = [m for m in z.infolist() if not m.is_dir()]
              if len(members) != 1050:
                  raise SystemExit(f'Expected 1050 complete PDF booklets, got {len(members)}')
              size_total = 0
              for m in members:
                  posix = PurePosixPath(m.filename)
                  if (posix.is_absolute() or '..' in posix.parts or len(posix.parts) != 2
                      or not posix.parts[0].startswith(('10_', '12_'))
                      or not posix.name.startswith('Set_') or not posix.name.endswith('.pdf')
                      or '\\' in m.filename or m.file_size > 30_000_000):
                      raise SystemExit(f'Unsafe or unexpected PDF path: {m.filename}')
                  size_total += m.file_size
                  if size_total > 1_000_000_000:
                      raise SystemExit('PDF archive exceeds static hosting limit')
                  target = dest.joinpath(*posix.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(m) as src, target.open('wb') as out:
                      from shutil import copyfileobj
                      copyfileobj(src, out)
                  with target.open('rb') as check:
                      if check.read(5) != b'%PDF-':
                          raise SystemExit(f'Invalid PDF header: {m.filename}')
          print(f'Published all {len(members)} model-paper + solution PDF files', flush=True)
          PY
          else
            echo "CGBSE full-PDF release asset not yet published. Public PDF buttons will correctly report unavailable instead of showing samples."
          fi
          touch "$RUNNER_TEMP/saurabh-site/.nojekyll"
          test -f "$RUNNER_TEMP/saurabh-site/index.html"
          test -f "$RUNNER_TEMP/saurabh-site/app.js"
          if [ -d "$RUNNER_TEMP/saurabh-site/vision-app" ]; then
            test -f "$RUNNER_TEMP/saurabh-site/vision-app/index.html"
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/saurabh-site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
