      - name: Compile APK
        shell: bash
        run: |
          cd vision-maths-science-keyboard
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate installable APK, manifest and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="vision-maths-science-keyboard/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -13
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.saurabhsvision.keyboard'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q 'android.view.InputMethod'
          mkdir -p keyboard-deliverables
          cp "$apk" keyboard-deliverables/S_Board_v1.9.19_SMOOTH_TOOLBAR_UPDATE.apk
          sha256sum keyboard-deliverables/*.apk | tee keyboard-deliverables/SHA256SUMS.txt

      - name: Include Android apksigner utility in CI artifact for privately signed updates
        shell: bash
        run: |
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" keyboard-deliverables/apksigner.jar
          test -s keyboard-deliverables/apksigner.jar

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: S_Board_v1_9_19_SMOOTH_TOOLBAR_APK
          path: keyboard-deliverables/*
          retention-days: 90

      - name: Publish direct-download GitHub test Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="s-board-v1.9.19"
          file="keyboard-deliverables/S_Board_v1.9.19_SMOOTH_TOOLBAR_UPDATE.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" keyboard-deliverables/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "$file" keyboard-deliverables/SHA256SUMS.txt \
              --title "S Board v1.9.19 • Smooth Typing & Compact Toolbar" \
              --notes "S Board 1.9.19 is a bug-fix and performance update to the original S Board experience. The full tools row now opens only on demand; a compact, collapsible mode label preserves keyboard space in Numbers, Symbols, Maths, Science and Emoji. Tapping S Board's brand closes expanded tools without unexpectedly changing input modes. Key settings are cached for each layout instead of repeatedly reading storage per button, and photo-theme artwork is reused until its photo changes. Emoji Search updates results in-place without rebuilding the entire keyboard on every typed character, preventing lag and missed inputs. All 51 original visual themes, 54 custom original stickers, local emoji search, Number/ABC, language modes, voice typing, encrypted clipboard, and Red Crystal logo remain. GitHub APK is debug-signed; use the separately stable-signed APK to upgrade the previous S Board stable version directly. Tests are automated emulator checks and do not guarantee identical results on all physical devices." \
              --latest=false
          fi

      - name: Enable KVM acceleration for Android Emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-sboard-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Real Android 15 emulator — tap typing + portrait/landscape IME
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash vision-maths-science-keyboard/scripts/emulator_typing_smoke.sh

      - name: Save emulator screenshots and typing audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S_Board_1_9_19_Android_Toolbar_Typing_Audit
          path: |
            /tmp/sboard-portrait.png
            /tmp/sboard-landscape.png
            /tmp/sboard-tap-result.xml
            /tmp/sboard-numbers.png
            /tmp/sboard-before-abc.xml
            /tmp/sboard-after-abc.xml
            /tmp/sboard-sboard-settings.png
            /tmp/sboard-sboard-settings.xml
            /tmp/sboard-theme-gallery.png
            /tmp/sboard-theme-gallery.xml
            /tmp/sboard-androidruntime.log
          if-no-files-found: ignore
          retention-days: 30
