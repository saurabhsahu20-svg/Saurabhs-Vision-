name: Publish Saurabh Vision Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: saurabhs-vision-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish public website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate public website before publishing
        shell: bash
        run: |
          set -euo pipefail
          node --check website/app.js
          node --check website/service-worker.js
          node --check website/firebase-service.js
          python3 website/tests/smoke.py
          grep -q 'wa.me/918085808586' website/app.js
          grep -q 'Parent / guardian' website/app.js
      - name: Test mobile, admission, quiz and study tools in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website/tests install --no-save --no-audit --no-fund playwright@1.56.1
          python3 -m http.server 8765 --bind 127.0.0.1 --directory website >/tmp/sv-website-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node website/tests/browser_smoke.mjs
      - name: Create static publish directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saurabh-site"
          cp -a website/. "$RUNNER_TEMP/saurabh-site/"
          # Publish only public frontend; do not host backend logic or policies.
          rm -rf "$RUNNER_TEMP/saurabh-site/functions" \
                 "$RUNNER_TEMP/saurabh-site/tests" \
                 "$RUNNER_TEMP/saurabh-site/APP_IMPORT_GUIDE.md" \
                 "$RUNNER_TEMP/saurabh-site/APP_IMPORT_TEST_REPORT.md" \
                 "$RUNNER_TEMP/saurabh-site/firestore.rules" \
                 "$RUNNER_TEMP/saurabh-site/storage.rules" \
                 "$RUNNER_TEMP/saurabh-site/firestore.indexes.json" \
                 "$RUNNER_TEMP/saurabh-site/firebase.json"
          # Extract the publicly committed owner app's web learning material.
          # This avoids republishing APK binaries or private Android account data.
          python3 - <<'PY'
          import json, os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          apk = Path('Saurabh_Vision_Quiz_Club_Test (4).apk')
          if not apk.exists():
              raise SystemExit('App content APK is missing; refusing incomplete public release.')
          root = Path(os.environ['RUNNER_TEMP']) / 'saurabh-site' / 'vision-app'
          allowed = {'.html','.css','.js','.json','.png','.jpg','.jpeg','.svg','.webp','.webmanifest','.txt'}
          count = 0
          with ZipFile(apk) as archive:
              for member in archive.infolist():
                  if member.is_dir() or not member.filename.startswith('assets/www/'):
                      continue
                  rel = member.filename[len('assets/www/'):]
                  p = PurePosixPath(rel)
                  if not rel or rel.startswith('/') or '..' in p.parts or '\\' in rel:
                      raise SystemExit('Unsafe application archive path')
                  if p.suffix.lower() not in allowed or 'fonts' in p.parts:
                      continue
                  dest = root.joinpath(*p.parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with archive.open(member) as inp, dest.open('wb') as out:
                      out.write(inp.read())
                  count += 1
          if not (root/'index.html').exists():
              raise SystemExit('App did not contain web entrypoint')
          samples=list(root.rglob('*.json'))
          if samples:
              json.loads(samples[0].read_text(encoding='utf-8'))
          # Discover the new shared Study Sprint from the imported Android app menu.
          # The feature page is hosted at ../study-sprint/ and does not collect account data.
          mobile = root / 'mobile.js'
          if mobile.exists():
              old = mobile.read_text(encoding='utf-8')
              marker = '<div class="more-list"><a class="chapter-entry" href="platform/index.html">'
              card = '<a class="chapter-entry" href="../study-sprint/index.html"><span aria-hidden="true">🎯</span><div><strong>Daily Study Sprint · NEW</strong><small>5 quick questions with explanations</small></div><span aria-hidden="true">→</span></a>'
              if old.count(marker) == 1 and 'Daily Study Sprint · NEW' not in old:
                  mobile.write_text(old.replace(marker, '<div class="more-list">'+card+'<a class="chapter-entry" href="platform/index.html">'),encoding='utf-8')
                  print('Added Study Sprint to web app learning menu')
              else:
                  # Older APKs use a different menu layout; provide an always-visible
                  # link without changing their existing quiz/learning JavaScript.
                  page = root / 'index.html'
                  if page.exists():
                      body = page.read_text(encoding='utf-8')
                      if '../study-sprint/index.html' not in body and '</body>' in body:
                          badge = '<a href="../study-sprint/index.html" aria-label="Daily Study Sprint" style="position:fixed;bottom:88px;right:12px;z-index:990;background:#ffd700;color:#071b49;text-decoration:none;padding:10px 14px;border-radius:24px;box-shadow:0 5px 18px #071b4955;font:800 13px system-ui">🎯 Daily Sprint</a>'
                          page.write_text(body.replace('</body>',badge+'</body>'),encoding='utf-8')
                          print('Added Study Sprint shortcut to hosted learning app')
                      else:
                          print('Study Sprint shortcut already present or incompatible HTML')
          # Add a visible public CGBSE teacher guide entry to the hosted APK web assets.
          # This modifies the GitHub Pages web copy only, not the downloadable Android APK.
          app_landing = root / 'index.html'
          if app_landing.exists():
              html = app_landing.read_text(encoding='utf-8')
              if '../cgbse-solutions/' not in html and '</body>' in html:
                  teacher_link = '<a href="../cgbse-solutions/" aria-label="CGBSE Class 10 and 12 teacher guides" style="position:fixed;bottom:138px;right:12px;z-index:989;background:#ffe16a;color:#071b49;text-decoration:none;padding:10px 14px;border-radius:24px;box-shadow:0 4px 15px #071b4940;font:800 12px system-ui">📚 CGBSE 10 / 12 Solutions</a>'
                  app_landing.write_text(html.replace('</body>', teacher_link + '</body>'), encoding='utf-8')
                  print('Linked CGBSE reader from hosted learning web app')
          print('Imported', count, 'public website app files including',len(samples),'JSON assets')
          PY
          # Publish all CGBSE question-and-answer PDFs from the public release asset.
          # No visitor uploads or ZIP-picker UI: each set is a direct static PDF.
          RELEASE_TAG="cgbse-2026-27"
          PDF_ARCHIVE="CGBSE_2026_27_All_1050_PDF_Booklets.zip"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$PDF_ARCHIVE" --dir "$RUNNER_TEMP"; then
              echo "Using the existing 1050 finished PDF booklets"
              python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path(os.environ['RUNNER_TEMP']) / "CGBSE_2026_27_All_1050_PDF_Booklets.zip"
          dest = Path(os.environ['RUNNER_TEMP']) / 'saurabh-site' / 'cgbse-solutions' / 'pdfs'
          if not archive.exists():
              raise SystemExit('Missing full PDF archive release asset')
          with ZipFile(archive) as z:
              members = [m for m in z.infolist() if not m.is_dir()]
              if len(members) != 1050:
                  raise SystemExit(f'Expected 1050 complete PDF booklets, got {len(members)}')
              size_total = 0
              for m in members:
                  posix = PurePosixPath(m.filename)
                  if (posix.is_absolute() or '..' in posix.parts or len(posix.parts) != 2
                      or not posix.parts[0].startswith(('10_', '12_'))
                      or not posix.name.startswith('Set_') or not posix.name.endswith('.pdf')
                      or '\\' in m.filename or m.file_size > 30_000_000):
                      raise SystemExit(f'Unsafe or unexpected PDF path: {m.filename}')
                  size_total += m.file_size
                  if size_total > 1_000_000_000:
                      raise SystemExit('PDF archive exceeds static hosting limit')
                  target = dest.joinpath(*posix.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(m) as src, target.open('wb') as out:
                      from shutil import copyfileobj
                      copyfileobj(src, out)
                  with target.open('rb') as check:
                      if check.read(5) != b'%PDF-':
                          raise SystemExit(f'Invalid PDF header: {m.filename}')
          print(f'Published all {len(members)} model-paper + solution PDF files', flush=True)
          PY
            elif gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "CGBSE_2026_27_Teacher_Papers_And_Answer_Guides.zip" --dir "$RUNNER_TEMP"; then
              echo "Converting compact teacher question-and-answer archive to all 1050 PDF booklets"
              sudo apt-get update -qq
              sudo apt-get install -y -qq fonts-noto-core
              python3 -m venv "$RUNNER_TEMP/cgbse-pdf-venv"
              "$RUNNER_TEMP/cgbse-pdf-venv/bin/pip" install -q "weasyprint>=63,<70"
              "$RUNNER_TEMP/cgbse-pdf-venv/bin/python" \
                website/cgbse-solutions/build_pdfs_from_html.py \
                "$RUNNER_TEMP/CGBSE_2026_27_Teacher_Papers_And_Answer_Guides.zip" \
                "$RUNNER_TEMP/saurabh-site/cgbse-solutions/pdfs"
            else
              echo "The release exists but does not contain a supported full question-and-answer archive."
              exit 1
            fi
          elif [ -s "website/cgbse-solutions/source/CGBSE_1050_Teacher_Library_Base64.txt" ]; then
            echo "Building CGBSE PDFs from the complete versioned public question-and-answer source."
            python3 website/cgbse-solutions/decode_embedded_source.py \
              website/cgbse-solutions/source/CGBSE_1050_Teacher_Library_Base64.txt \
              "$RUNNER_TEMP/CGBSE_Teacher_Library_Reconstructed.zip"
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-core
            python3 -m venv "$RUNNER_TEMP/cgbse-pdf-venv"
            "$RUNNER_TEMP/cgbse-pdf-venv/bin/pip" install -q "weasyprint>=63,<70"
            "$RUNNER_TEMP/cgbse-pdf-venv/bin/python" \
              website/cgbse-solutions/build_pdfs_from_html.py \
              "$RUNNER_TEMP/CGBSE_Teacher_Library_Reconstructed.zip" \
              "$RUNNER_TEMP/saurabh-site/cgbse-solutions/pdfs"
          else
            echo "CGBSE complete source is missing, so no PDFs will be falsely represented as available."
          fi
          if [ -s "website/cgbse-solutions/source/CGBSE_1050_Teacher_Library_Base64.txt" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import os
          dest = Path(os.environ["RUNNER_TEMP"]) / "saurabh-site/cgbse-solutions/pdfs"
          pdfs = list(dest.glob("*/*.pdf"))
          if len(pdfs) != 1050:
              raise SystemExit(f"PDF publication incomplete: expected 1050, got {len(pdfs)}")
          for p in pdfs:
              with p.open("rb") as check:
                  if check.read(5) != b"%PDF-":
                      raise SystemExit(f"Invalid PDF: {p}")
          print(f"Verified {len(pdfs)} published question-and-answer PDFs")
          PY
          fi
          # Keep compressed source and build utilities in GitHub only, not the public Pages root.
          rm -rf "$RUNNER_TEMP/saurabh-site/cgbse-solutions/source"
          rm -f "$RUNNER_TEMP/saurabh-site/cgbse-solutions/"*.py
          touch "$RUNNER_TEMP/saurabh-site/.nojekyll"
          test -f "$RUNNER_TEMP/saurabh-site/index.html"
          test -f "$RUNNER_TEMP/saurabh-site/app.js"
          if [ -d "$RUNNER_TEMP/saurabh-site/vision-app" ]; then
            test -f "$RUNNER_TEMP/saurabh-site/vision-app/index.html"
          fi
      - name: Publish 66 uploaded Class 10 model-paper PDFs when archive is released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="vision-class10-66-model-papers"
          ZIP="SAURABHS_VISION_ALL_66_PAPERS_STEP_SOLUTIONS.zip"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Class 10 PDFs have not been released yet; the catalog correctly shows unavailable files."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/vision-model-archive"
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP" --dir "$RUNNER_TEMP/vision-model-archive"; then
            echo "Model paper archive not attached yet; the PDF buttons remain unavailable."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import os, re
          zpath=Path(os.environ['RUNNER_TEMP'])/'vision-model-archive'/'SAURABHS_VISION_ALL_66_PAPERS_STEP_SOLUTIONS.zip'
          target=Path(os.environ['RUNNER_TEMP'])/'saurabh-site'/'model-paper-library'/'pdfs'
          subjects=('English','Hindi','Mathematics','Sanskrit','Science','Social_Science')
          expected={
            f'Class_10/10_{subject}/{name}'
            for subject in subjects
            for name in ['Original_2025-26.pdf']+
              [f'Full75_Set_{n:02}.pdf' for n in range(1,6)]+
              [f'Set_{n:02}.pdf' for n in range(1,6)]
          }
          with ZipFile(zpath) as z:
            pdfs=[m for m in z.infolist() if m.filename.lower().endswith('.pdf') and not m.is_dir()]
            names=[m.filename for m in pdfs]
            if len(pdfs)!=66 or set(names)!=expected or len(set(names))!=66:
              raise SystemExit(f'Expected the exact 66 Class 10 source/study PDF paths, found {len(pdfs)} files.')
            total=0
            for entry in pdfs:
              parts=PurePosixPath(entry.filename).parts
              if len(parts)!=3 or any(part in ('.','..') for part in parts) or '\\' in entry.filename:
                raise SystemExit('Unsafe PDF archive path: '+entry.filename)
              if entry.file_size>10_000_000:
                raise SystemExit('Unexpectedly large PDF: '+entry.filename)
              total+=entry.file_size
              if total>100_000_000:
                raise SystemExit('Model paper pack exceeds the approved size.')
              dest=target.joinpath(*parts)
              dest.parent.mkdir(parents=True,exist_ok=True)
              with z.open(entry) as src, dest.open('wb') as out:
                start=src.read(5)
                if start!=b'%PDF-':
                  raise SystemExit('Not a PDF: '+entry.filename)
                out.write(start)
                import shutil
                shutil.copyfileobj(src,out)
          print('Published all',len(pdfs),'Class 10 model paper PDFs:',total,'bytes.')
          PY
      - name: Publish 36 Class 12 original and guided PDFs from two validated ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, ZIP_DEFLATED
          import os, shutil
          root=Path('website/model-paper-library/packs')
          part1=root/'Class12_25_Practice_Sets_Step_By_Step.zip'
          part2=root/'Class12_Hindi_6_Papers.zip'
          output=Path(os.environ['RUNNER_TEMP'])/'saurabh-site'/'model-paper-library'/'pdfs'
          packs=Path(os.environ['RUNNER_TEMP'])/'saurabh-site'/'model-paper-library'/'packs'
          subjects=('Physics','Chemistry','Biology','Mathematics','English','Hindi')
          other_subjects=subjects[:-1]
          practice={
            f'Class_12/12_{subject}/Practice_Set_{n:02d}.pdf'
            for subject in subjects for n in range(1,6)
          }
          originals={
            f'Class_12/12_{subject}/Original_2025-26.pdf'
            for subject in subjects
          }
          p25={
            f'Class_12/12_{subject}/Practice_Set_{n:02d}.pdf'
            for subject in other_subjects for n in range(1,6)
          }
          hindi={
            f'Class_12/12_Hindi/{name}'
            for name in ['Original_2025-26.pdf']+
              [f'Practice_Set_{n:02d}.pdf' for n in range(1,6)]
          }
          if not part1.is_file() or not part2.is_file():
            raise SystemExit('Both 25-existing and Hindi-6 PDF archives are required')
          total=0
          for zip_path,expected in ((part1,p25),(part2,hindi)):
            with ZipFile(zip_path) as archive:
              if archive.testzip() is not None:
                raise SystemExit('Class 12 ZIP CRC invalid: '+str(zip_path))
              pdfs=[i for i in archive.infolist() if i.filename.lower().endswith('.pdf') and not i.is_dir()]
              names=[i.filename for i in pdfs]
              if len(names)!=len(expected) or len(set(names))!=len(expected) or set(names)!=expected:
                raise SystemExit('Class 12 ZIP PDF paths are incomplete or unexpected: '+str(zip_path))
              for item in archive.infolist():
                path=PurePosixPath(item.filename)
                if path.is_absolute() or '..' in path.parts or '\\' in item.filename:
                  raise SystemExit('Unsafe Class 12 ZIP entry: '+item.filename)
              for entry in pdfs:
                if entry.file_size>7_000_000:
                  raise SystemExit('Oversized Class 12 PDF: '+entry.filename)
                total+=entry.file_size
                if total>65_000_000:
                  raise SystemExit('Class 12 PDF collection exceeds safe size')
                dest=output.joinpath(*PurePosixPath(entry.filename).parts)
                dest.parent.mkdir(parents=True,exist_ok=True)
                with archive.open(entry) as src,dest.open('wb') as out:
                  if (magic:=src.read(5))!=b'%PDF-':
                    raise SystemExit('Invalid PDF signature: '+entry.filename)
                  out.write(magic)
                  shutil.copyfileobj(src,out)
          if len(practice)!=30 or len(originals)!=6:
            raise SystemExit('Incorrect expected paper counts')
          for name in sorted(originals|practice):
            target=output.joinpath(*PurePosixPath(name).parts)
            if not target.is_file() or target.open('rb').read(5)!=b'%PDF-':
              raise SystemExit('Missing or corrupt public Class 12 PDF: '+name)
          packs.mkdir(parents=True,exist_ok=True)
          groups=(
            ('Class12_30_Practice_Sets_Step_By_Step.zip',practice),
            ('Class12_6_Original_Model_Papers.zip',originals),
            ('Class12_All_36_Model_Papers.zip',originals|practice),
          )
          for filename,names in groups:
            output_path=packs/filename
            with ZipFile(output_path,'w',compression=ZIP_DEFLATED,compresslevel=8) as bundle:
              for name in sorted(names):
                bundle.write(output.joinpath(*PurePosixPath(name).parts),name)
            with ZipFile(output_path) as verified:
              if verified.testzip() or len(verified.namelist())!=len(names):
                raise SystemExit('Generated ZIP failed integrity checks: '+filename)
          print('Published 6 source PDFs, 30 guided practice PDFs and three validated ZIP packs')
          PY
      - name: Publish exact 36 owner-uploaded Class 12 PDFs (no build dependencies)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, ZIP_DEFLATED
          from io import BytesIO
          import base64, hashlib, os, shutil
          parts=sorted(Path('data/model-paper-archives/class12-additional-six').glob('split-*.b64'))
          if len(parts)!=16:
            raise SystemExit(f'Incomplete Class 12 source archive: {len(parts)} of 16 chunks')
          encoded=b''.join(b''.join(part.read_bytes().split()) for part in parts)
          if len(encoded)!=7667384:
            raise SystemExit(f'Wrong encoded archive length: {len(encoded)}')
          original=base64.b64decode(encoded,validate=True)
          expected_sha='8f4b457b54cb66c929d09d942806fd905d539e2142817c7059d4f8b9db3b91c4'
          if hashlib.sha256(original).hexdigest()!=expected_sha:
            raise SystemExit('Exact owner ZIP checksum mismatch: refuse publication')
          originals={
            'Accountancy':'7c7e8b503922bbe6efe371275f64e9a668ef27a0613e794dba378cfddc16eb26',
            'Business_Studies':'2a891933de41e93497037f3caf0711ab41b91d365b58cee0fbfe96e50c80725a',
            'Economics':'4c7c1e1194b90f43eda873e33e1f79eb249823a5e0280bb0f00a5efd4493fe82',
            'History':'531963a47719fa1d7be26c65c6ebdb8138ca2932db35ce6b7b4b779e284f0afa',
            'Geography':'2f3b8a8f931c9db75978d5d131f675c80d29554c0f1b2a2f800b492601745051',
            'Political_Science':'bc4a327c55b32fe410bb4e7407f3164b9cb35f80d13c2a489d5b608544cc1243'
          }
          expected={
            f'Class_12/12_{subject}/Original_2025-26.pdf'
            for subject in originals
          }|{
            f'Class_12/12_{subject}/Practice_Set_{n:02d}.pdf'
            for subject in originals for n in range(1,6)
          }
          target=Path(os.environ['RUNNER_TEMP'])/'saurabh-site'/'model-paper-library'
          pdfs=target/'pdfs';packs=target/'packs'
          pdfs.mkdir(parents=True,exist_ok=True);packs.mkdir(parents=True,exist_ok=True)
          with ZipFile(BytesIO(original)) as source:
            names=source.namelist()
            if len(names)!=36 or len(set(names))!=36 or set(names)!=expected:
              raise SystemExit('The 36-PDF archive has incorrect entries')
            if source.testzip() is not None:
              raise SystemExit('Archive CRC error')
            total=0
            for entry in source.infolist():
              path=PurePosixPath(entry.filename)
              if path.is_absolute() or '..' in path.parts or '\\' in entry.filename or len(path.parts)!=3:
                raise SystemExit('Unsafe PDF path: '+entry.filename)
              if entry.file_size>6_000_000:
                raise SystemExit('Unexpected large PDF: '+entry.filename)
              total+=entry.file_size
              if total>35_000_000:
                raise SystemExit('Overlarge expanded PDF pack')
              filedata=source.read(entry)
              if not filedata.startswith(b'%PDF-'):
                raise SystemExit('Invalid PDF: '+entry.filename)
              subject=path.parts[1][3:]
              if path.name=='Original_2025-26.pdf':
                if hashlib.sha256(filedata).hexdigest()!=originals[subject]:
                  raise SystemExit('Original CGBSE model paper was modified: '+subject)
              dest=pdfs.joinpath(*path.parts)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(filedata)
          practices={name for name in expected if '/Practice_Set_' in name}
          for archive_name,items in (
            ('Class12_Additional_30_Guided_Sets.zip',practices),
            ('Class12_Additional_36_Papers.zip',expected)
          ):
            output=packs/archive_name
            with ZipFile(output,'w',ZIP_DEFLATED,compresslevel=8) as zipout:
              for name in sorted(items):
                zipout.write(pdfs.joinpath(*PurePosixPath(name).parts),name)
            with ZipFile(output) as verify:
              if set(verify.namelist())!=items or verify.testzip() is not None:
                raise SystemExit('Invalid site download ZIP: '+archive_name)
          print('PASS: all 36 byte-verified owner Class 12 papers published (6 originals + 30 fully worked practice).')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/saurabh-site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
