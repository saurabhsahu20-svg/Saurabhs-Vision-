name: Build S Browser Android APK

on:
  push:
    branches: [main]
    paths:
      - 's-browser/**'
      - '.github/workflows/build-s-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 's-browser/**'
      - '.github/workflows/build-s-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify offline dictionary and browser rules
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          javac -encoding UTF-8 -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/AddressResolver.java             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/DictionaryEntry.java             s-browser/tests/AddressResolverTest.java             s-browser/tests/DictionaryEntryTest.java
          java -ea -cp "$dir" AddressResolverTest
          java -ea -cp "$dir" DictionaryEntryTest
          javac -encoding UTF-8 -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/GovtSources.java             s-browser/tests/GovtSourcesTest.java
          java -ea -cp "$dir" GovtSourcesTest
          javac -encoding UTF-8 -cp "$dir" -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/CityNewsSources.java             s-browser/tests/CityNewsSourcesTest.java
          java -ea -cp "$dir" CityNewsSourcesTest
          javac -encoding UTF-8 -cp "$dir" -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/DailyAssemblyContent.java             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/DailyNewsSources.java             s-browser/tests/DailyAssemblyContentTest.java             s-browser/tests/DailyNewsSourcesTest.java
          java -ea -cp "$dir" DailyAssemblyContentTest
          java -ea -cp "$dir" DailyNewsSourcesTest
          python3 s-browser/tools/test_news_digest.py
          javac -encoding UTF-8 -d "$dir" \
            s-browser/app/src/main/java/com/saurabhsvision/sbrowser/GriflyVersion.java \
            s-browser/tests/GriflyVersionTest.java
          java -ea -cp "$dir" GriflyVersionTest
          python3 - <<'PY'
          from pathlib import Path
          src=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/MainActivity.java').read_text(encoding='utf-8')
          checker=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/GriflyUpdateChecker.java').read_text(encoding='utf-8')
          assert 'onRenderProcessGone' in src, 'No renderer recovery handler'
          assert 'checkGriflyUpdates(false)' in src and 'checkGriflyUpdates(true)' in src, 'Update check UI missing'
          assert 'last_checked' in src and 'auto_check' in src, 'Update check preferences missing'
          assert 'api.github.com/repos/saurabhsahu20-svg/Saurabhs-Vision-/releases' in checker
          assert 'ASSET_PREFIX+tag+"/"+name' in checker, 'Update URL not authenticated against GitHub'
          assert 'View official update' in src and 'In-place updates require the same signing certificate' in src
          assert 'Grifly 1.8.3 Beta' not in src, 'Outdated About version hardcoded'
          print('PASS: update check, signed-APK guidance, renderer crash recovery and version info')
          PY
          javac -encoding UTF-8 -d "$dir" \
            s-browser/app/src/main/java/com/saurabhsvision/sbrowser/ModelPaperCatalog.java \
            s-browser/tests/ModelPaperCatalogTest.java
          java -ea -cp "$dir" ModelPaperCatalogTest
          python3 - <<'PY'
          from pathlib import Path
          src=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/MainActivity.java').read_text(encoding='utf-8')
          offline=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/ModelPaperLibraryActivity.java').read_text(encoding='utf-8')
          manifest=Path('s-browser/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert 'openNativeModelPapers' in src, 'Offline Model Papers navigation missing'
          assert 'model_papers_v190_shown' not in src, 'Unwanted first-launch popup still present'
          assert 'homeBanner(layout,"📚","कक्षा 10 • 66 Model Papers"' not in src, 'Unwanted front page banner still present'
          assert 'addQuickTab("📚 कक्षा 10 • 66 PDF"' not in src, 'Unwanted top tab still present'
          assert 'MODEL PAPERS • CLASS 10' in src, 'Study Dashboard Model Papers entry missing'
          assert 'Vision Website • 140 PDFs • Subjects • Preview & Solutions' in src, 'Owner website study dashboard link missing'
          assert '0xffd6f6f1,0xff9ee5dc,0xff63c7b7,' in src and '()->openAddress(VISION_PAPERS_URL)' in src, 'Study Dashboard paper banner must open owner website'
          assert 'homeFeature("📚","Model Papers"' in src, 'Study Tools access missing'
          assert 'VISION_KA_SAAR_URL' in src and 'vision-ka-saar/' in src, 'Vision Ka Saar online link missing'
          assert 'homeFeature("💡","Vision Ka Saar"' in src, 'Vision Ka Saar missing in Study Tools'
          assert 'homeFeature("📱","Vision App 140"' in src, 'Installed Vision launcher missing in Study Tools'
          assert 'com.saurabhsvision.quizclub.v417x' in src and 'com.saurabhsvision.quizclub.v416x' in manifest, 'Latest 140-paper installed app not detectable'
          assert 'MODEL PAPERS • CLASS 10 + 12' in src, 'Student Dashboard not updated to 140 PDFs'
          assert 'homeBanner(layout,"📚","कक्षा 10 • 66 Model Papers"' not in src, 'Front Home promotion must remain removed'
          assert 'homeFeature("📥","Offline ZIP 66"' in src, 'Offline Papers Study Tools access missing'
          assert 'Offline ZIP 66' in src and 'model-paper-library/' in src
          assert 'android:name=".ModelPaperLibraryActivity"' in manifest
          assert 'Offline Library:' in offline and '↻ दूसरी ZIP से PDF अपडेट करें' in offline, 'Missing clear local PDF availability feedback'
          for required in ('ACTION_OPEN_DOCUMENT','ZipInputStream','PdfRenderer','ACTION_CREATE_DOCUMENT','expectedPdf(path)','found.equals(ModelPaperCatalog.allPdfPaths())'):
              assert required in offline, required
          assert 'android.permission.MANAGE_EXTERNAL_STORAGE' not in manifest
          print('PASS: offline PDF picker, strict ZIP verification and separate native Preview / Save')
          PY

          python3 - <<'PY'
          from pathlib import Path
          main=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/MainActivity.java').read_text(encoding='utf-8')
          activity=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/DailyAssemblyActivity.java').read_text(encoding='utf-8')
          client=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/AssemblyNewsSource.java').read_text(encoding='utf-8')
          # Check real navigation wiring, not fragile visible copy or comments.
          assert 'String[] quickLabels=' in main
          assert 'General News' in main and 'Sports News' in main
          assert 'homeBanner(layout' in main
          assert "openAssemblySection(4)" in main and "openAssemblySection(3)" in main
          assert "AssemblyNewsSource.fetch(" in activity
          assert "renderNewsError(" in activity and "renderHeadline(" in activity
          assert "if(shown>=10)break;" in activity
          assert "Missing headlines are never invented." in activity
          assert "private void openOnlineDictionary(" in main
          assert "en.wiktionary.org/w/index.php?search=" in main
          assert "for(char c='A';c<='Z';c++)" in main
          assert "Read source" in activity and "Cross-check" in activity
          assert "fetchDigest(" in client and "fetchSchoolNewsRss(" in client
          assert "trustedPublisherUrl" in client and "MAX_DIGEST_AGE" in client
          print('PASS news fallback, original source links and professional news desk UI')
          PY
          javac -encoding UTF-8 -cp "$dir" -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/NewsQualityGate.java             s-browser/tests/NewsQualityGateTest.java
          java -ea -cp "$dir" NewsQualityGateTest
          python3 - <<'PY'
          from pathlib import Path
          dictionary=Path('s-browser/app/src/main/assets/dictionary.tsv')
          lines=[x for x in dictionary.read_text(encoding='utf-8').splitlines() if x and not x.startswith('#')]
          assert len(lines)>=300, f'Only {len(lines)} offline dictionary entries'
          assert all(len(x.split('\t'))==4 for x in lines), 'Malformed dictionary entry'
          words=[x.split('\t')[0].lower() for x in lines]
          assert len(set(words))==len(words), 'Duplicate dictionary words'
          initials={w[0].upper() for w in words if w and 'a'<=w[0]<='z'}
          missing=set('ABCDEFGHIJKLMNOPQRSTUVWXYZ')-initials
          assert not missing, f'Offline dictionary missing alphabet initials: {sorted(missing)}'
          print(f'PASS {len(lines)} offline dictionary entries spanning A-Z')
          PY
          python3 - <<'PY'
          from pathlib import Path
          source=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/MainActivity.java').read_text(encoding='utf-8')
          assert 'VISION_PAPERS_URL' in source and 'model-paper-library/' in source, 'Online model-paper library link missing'
          assert 'Offline Papers' in source and 'openInstalledVisionModelPapers' in source, 'Offline Model Papers shortcut missing'
          assert 'Saurabh Vision Learning App' in source, 'Owner learning shortcut missing'
          assert 'https://saurabhsahu20-svg.github.io/Saurabhs-Vision-/vision-app/' in source, 'Owner learning app URL missing'
          legacy=['https://ncert.nic.in/','https://www.khanacademy.org/','https://www.wikipedia.org/','https://scholar.google.com/']
          assert not any(x in source for x in legacy), 'Legacy learning shortcuts still on homepage'
          print('PASS owner learning app replaces all external education shortcuts')
          PY
          python3 - <<'PY'
          from pathlib import Path
          main=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/MainActivity.java').read_text(encoding='utf-8')
          city=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/CityNewsActivity.java').read_text(encoding='utf-8')
          cache=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/CityNewsCache.java').read_text(encoding='utf-8')
          feed=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/CityNewsFeed.java').read_text(encoding='utf-8')
          import re
          handlers=re.findall(r'@Override\s+protected\s+void\s+onActivityResult\s*\(',main)
          assert len(handlers)==1, f'Expected 1 activity-result handler, found {len(handlers)}'
          assert 'request==PICK_FILE' in main
          assert 'request==VOICE_SEARCH' in main
          assert 'QR_SCAN' not in main and 'openQrScanner' not in main
          print('PASS activity-result handler is unique; file uploads and voice search work without QR dependency')
          assert 'HorizontalScrollView tabStrip' in main
          assert 'private void refreshTabStrip()' in main
          assert 'if(web.getParent()!=contentFrame)' in main
          assert 'web.onResume()' in main and 'tab.web.onPause()' in main
          assert 'private void showRecoveryActions()' in city
          assert 'CityNewsCache.load(' in city and 'CityNewsCache.save(' in city
          assert 'Saved, NOT live' in city
          assert 'MAX_CACHE_AGE_MS=12L*60L*60L*1000L' in cache
          assert 'java.net.SocketTimeoutException' in feed
          assert 'Saurabh Vision Learning App' in main
          print('PASS visible tab strip, WebView persistence, network recovery, explicit cached-news label')
          PY

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore persistent Android signing key when configured
        shell: bash
        env:
          GRIFLY_SIGNING_KEYSTORE_BASE64: ${{ secrets.GRIFLY_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$GRIFLY_SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$GRIFLY_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/grifly-stable-signing.jks"
            chmod 600 "$RUNNER_TEMP/grifly-stable-signing.jks"
            echo "Owner's persistent signing key is available (never printed)."
          else
            echo "::warning::No persistent signing key configured. Debug-signed APKs may require uninstalling older builds. Configure four GitHub Secrets before relying on in-place updates."
          fi

      - name: Compile S Browser debug APK
        working-directory: s-browser
        shell: bash
        env:
          GRIFLY_KEYSTORE_FILE: ${{ runner.temp }}/grifly-stable-signing.jks
          GRIFLY_KEYSTORE_PASSWORD: ${{ secrets.GRIFLY_SIGNING_STORE_PASSWORD }}
          GRIFLY_KEY_ALIAS: ${{ secrets.GRIFLY_SIGNING_KEY_ALIAS }}
          GRIFLY_KEY_PASSWORD: ${{ secrets.GRIFLY_SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p ../dist
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee ../dist/android-build.log

      - name: Explain failed build and retain diagnostic log
        if: failure()
        shell: bash
        run: |
          echo "### S Browser build failed" >> "$GITHUB_STEP_SUMMARY"
          if test -s dist/android-build.log; then
            echo "Check the Compile S Browser debug APK step for the exact compiler error." >> "$GITHUB_STEP_SUMMARY"
            echo "#### Error excerpts" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            grep -n -E 'error:|FAILURE:|What went wrong|Execution failed|Caused by:|cannot find symbol' dist/android-build.log | tail -50 >> "$GITHUB_STEP_SUMMARY" || true
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Failed before Gradle compilation. Expand the first failed step above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save compiler failure excerpt in public repo for diagnosis
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s-browser/build-diagnostics
          REPORT=s-browser/build-diagnostics/latest.txt
          {
            echo "S Browser Android build diagnostic"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_RUN_ID}"
            echo "Note: compiler/error excerpts only; not a complete Gradle log"
            if test -s dist/android-build.log; then
              grep -n -E 'error:|FAILURE:|What went wrong:|Execution failed|Caused by:|cannot find symbol|Could not|BUILD FAILED' dist/android-build.log | tail -60 || true
            else
              echo "Build failed before compile log was created; check workflow steps."
            fi
          } > "$REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m "ci: record latest S Browser build failure diagnostic"
            # Token-created pushes do not trigger another Actions push build.
            git push origin HEAD:main || echo "Diagnostic push failed; check job logs"
          fi

      - name: Upload failed-build diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: S-Browser-Build-Diagnostics
          path: dist/android-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK exists and is signed
        shell: bash
        run: |
          set -euo pipefail
          APK="s-browser/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/Grifly_v1.9.4_Vision_140_Papers_Sync.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grifly-v1.9.4-APK
          path: dist/Grifly_v1.9.4_Vision_140_Papers_Sync.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta APK on GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="grifly-v1.9.4-vision-140-papers-sync-beta"
          FILE="dist/Grifly_v1.9.4_Vision_140_Papers_Sync.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "Grifly 1.9.4 Beta — Vision 140 PDF Sync" \
              --notes "Grifly v1.9.4 adds direct Vision Ka Saar Maths/Science in Study Tools, class 10+12 140-paper online library, and correctly launches Saurabh's Vision v4.1.7 installed on Android. Original clean Home and all previously supported study features are preserved. Grifly v1.9.3 adds an optional daily GitHub update checker, manual Check Updates and auto-notification toggle under Tools, renderer crash recovery, accurate About version and updated GitHub release shortcut. Website pages load fresh automatically; native updates always require Android approval and a consistent signing key. Build supports signing via protected GitHub Secrets; without a configured persistent key the debug APK does not guarantee in-place upgrade. Grifly v1.9.2 links the organized Model Paper Library on the owner's Saurabh Vision website directly from the Study Dashboard. Grifly v1.9.1 removes the Model Papers banner, forced first-launch popup and prominent quick tab from the search Home, restoring the clean original interface. Model Paper Library stays accessible in Student Dashboard, Study Tools and the online papers tab. All 66 offline papers and reader features remain available after ZIP import. Grifly v1.9.0 brought Model Papers front-and-center on the FIRST screen and Student Dashboard, fixes hidden tabs and adds a one-time new-feature discovery dialog. Its offline reader clearly shows 0/66 or 66/66 PDFs and instructions. No new permissions. Grifly v1.8.9 adds a native offline PDF Model Paper Library: choose and import the owner-provided 66-PDF ZIP once via Android Documents picker, then preview 75-mark worked solutions and diagrams, navigate pages, and save a selected PDF to the user-chosen location. No new permissions, background uploads or silent downloads. Grifly v1.8.8 adds a distinct online Class 10 Model Paper Library shortcut on its quick tab bar and homepage Study Tools, while preserving a separate offline Study Test APK launch button. The catalog correctly flags PDFs as unavailable until the owner publishes all 66 original/new sets as a verified GitHub release asset. Grifly v1.8.7 prefers the locally installed Vision v4.1.5 offline 75-mark paper pack with 30 stepped solutions and diagrams. Earlier v4.1.4/v4.1.3 packs stay available as fallbacks. Grifly v1.8.6 first opens the installed 75-mark v4.1.4 Vision Study Test app and falls back to the earlier 4.1.3 Study Test, preserving all browser features. Grifly v1.8.5 adds a Model Papers shortcut to the installed Saurabh Vision Study Test app; it does not upload student data. Grifly v1.8.4 enhances the rainbow Grifly wordmark with a subtly highlighted badge while retaining all browser functionality. Grifly v1.8.3 rebrands S Browser with a rainbow-colored name and retains the blank district, India and world worksheets plus official reference PDFs in the Maps Download tile to the Student Dashboard with official downloadable PDFs of Chhattisgarh, India political and outline maps, and world maps. All other S Browser 1.8 features remain unchanged. Previous version: General and Sports news timeout dead ends with a two-stage attributed news feed: the privacy-friendly GitHub Pages bulletin, refreshed periodically by scheduled GitHub Actions from established Hindi/English publishers and PIB where possible; fallback to live Google News RSS, and visible Retry/Open Latest News/official PIB-News On AIR links on total outage. All cards have publisher, actual feed publication date, original news link and Cross-check action. No generated or fake news. A scheduled bulletin is clearly marked as last synced, NOT instant live breaking coverage. Premium news desk layout, clean gradient header, polished buttons, and dedicated one-tap General and Sports cards on the main homepage. CG Jobs, City News, Saurabh Vision learning shortcut, offline dictionary, Daily Assembly, smooth tabs and original S Browser icon are preserved. Android beta: real-device tests and external feeds cannot be guaranteed; publishers are not independently fact-checked." \
              --prerelease
          fi
