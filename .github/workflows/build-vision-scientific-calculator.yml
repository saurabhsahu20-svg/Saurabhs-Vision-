name: Build VISION CALC Scientific Calculator APK

on:
  push:
    branches: [main]
    paths:
      - 'vision-scientific-calculator/**'
      - '.github/workflows/build-vision-scientific-calculator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vision-calc-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test scientific maths and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Validate real app, offline permissions and Android source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vision-scientific-calculator')
          manifest=(p/'app/src/main/AndroidManifest.xml').read_text()
          source=(p/'app/src/main/java/com/saurabhsvision/visioncalc/MainActivity.java').read_text()
          engine=(p/'app/src/main/java/com/saurabhsvision/visioncalc/ExpressionEngine.java').read_text()
          converter=(p/'app/src/main/java/com/saurabhsvision/visioncalc/UnitConverter.java').read_text()
          for forbidden in ('android.permission.INTERNET','READ_CONTACTS','RECORD_AUDIO',
                            'ACCESS_FINE_LOCATION','READ_EXTERNAL_STORAGE'):
              assert forbidden not in manifest, forbidden
          assert 'allowBackup="false"' in manifest
          assert 'extends Activity' in source
          for item in ('UNIT CONVERTER','RECENT CALCULATIONS','sin','log','factorial',
                       'history','memory','ClipboardManager','DEG','RAD'):
              assert item in source or item in engine, item
          assert 'UnitConverter.count()' in source or 'UnitConverter.names()' in source
          assert 'versionName \'1.7.0\'' in (p/'app/build.gradle').read_text()
          # The visual reference demands a four-column keypad with real maths.
          assert 'String[][] rows={' in source
          for row in ('{"AC","()","%","÷"}', '{"7","8","9","×"}',
                      '{"4","5","6","−"}', '{"1","2","3","+"}',
                      '{"0",".","⌫","="}'):
              assert row in source, row
          for feature in ('numericKey(', 'scientificOpen','darkMode',
                          'getDisplayMetrics().heightPixels','recentResult()',
                          'ScrollView','setFillViewport(true)',
                          'new LinearLayout.LayoutParams(-1,-2)',
                          'CALCULATE SMART','SCIENTIFIC TOOLS',
                          'Tap to switch','showTab();'):
              assert feature in source, feature
          assert 'View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR' in source
          assert 'View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR' in source
          assert 'case "()":' in source
          assert 'case ",":' in source
          assert 'case "π":case "e":' in source
          assert 'new LinearLayout.LayoutParams(-1,0,1f)' not in source
          # S CALC Pro must wire the screenshot-inspired design to real actions.
          assert 'if(tab==0)buildComfortCalculator()' in source and 'else if(tab==1)buildProCalculator()' in source
          assert 'String[][] sciences={' in source and 'String[][] numeric={' in source
          for row in ('{"sin","cos","tan","cot","sec","csc"}',
                      '{"log","ln","10ˣ","eˣ","x²","x³"}',
                      '{"√x","∛x","|x|","π","nCr","nPr"}',
                      '{"(",")","x!","%","DEG","RAD"}',
                      '{"7","8","9","AC","⌫"}',
                      '{"0",".","EXP","Ans","="}'):
              assert row in source, row
          assert 'proScientificKey(key,selected)' in source
          assert 'proNumberKey(key)' in source
          assert 'b.setOnClickListener(v->pressProScience(key))' in source
          assert 'b.setOnClickListener(v->onKey(key))' in source
          assert 'themeToggle.setOnClickListener(v->showProMenu())' in source
          assert 'case "EXP":' in source and 'expression+="E"' in source
          assert 'case "x³":' in source and 'case "cot":' in engine
          assert 'case "sec":' in engine and 'case "csc":' in engine
          assert 'android:icon="@drawable/ic_s_calc_comfort"' in manifest
          assert 'comfortTheme' in source
          assert 'chooseComfortTheme()' in source
          assert 'String[][] rows={' in source
          assert 'private void buildComfortCalculator()' in source
          assert 'private Button comfortKey(String label)' in source
          assert 'themeIndex=ComfortTheme.clamp(prefs.getInt("comfortTheme",0));' in source
          assert (p/'app/src/main/java/com/saurabhsvision/visioncalc/ComfortTheme.java').is_file()
          assert 'getSystemWindowInsetBottom()' in source
          print('PASS: Real S CALC Pro screenshot-inspired UI, 24 science controls and keypad actions')

          assert 'scientificChip(token)' in source
          assert 'scienceGrid.addView(row' in source
          assert 'dp(50)' in source
          assert 'keypadRows.add(row)' in source
          assert 'keypadFooter=footer' in source
          assert 'expandKeypadToViewport()' in source
          assert 'CalculatorLayoutPolicy.extraPerKeyRow(' in source
          assert 'getSystemWindowInsetTop()' in source
          assert 'getSystemWindowInsetBottom()' in source
          assert (p/'app/src/main/java/com/saurabhsvision/visioncalc/CalculatorLayoutPolicy.java').is_file()
          print('PASS: scientific keypad and new 4-column pastel keys use adaptive height')
          print('PASS: screenshot-inspired four-column design and functioning controls')
          assert 'Math.pow' in engine and 'Math.sin' in engine
          assert 'Temperature' in converter and 'Frequency' in converter
          assert (p/'app/src/main/res/drawable-nodpi/ic_s_calc_comfort.webp').is_file()
          icon=(p/'app/src/main/res/drawable-nodpi/ic_s_calc_comfort.webp').read_bytes()
          assert icon[:4]==b'RIFF' and icon[8:12]==b'WEBP' and len(icon)>6000
          import hashlib
          assert hashlib.sha256(icon).hexdigest()=='bbffd4564c1948d6b0e6f5bf6ac1ff11c35359ab6616c527034507f105e8c6d8'
          assert 'new LinearLayout.LayoutParams(dp(56),dp(56))' in source
          assert 'android:icon="@drawable/ic_s_calc_comfort"' in manifest
          assert 'android:roundIcon="@drawable/ic_s_calc_comfort"' in manifest
          assert 'icon.setImageResource(R.drawable.ic_s_calc_comfort);' in source
          assert 'TextView logoName=text("S VISION"' in source
          assert "private boolean cacheMatches()" in source
          assert "cachedFormatted=exact!=null?exact:ExpressionEngine.format(value);" in source
          assert "String exact=DecimalArithmetic.tryFormat(expression);" in source
          assert (p/'app/src/main/java/com/saurabhsvision/visioncalc/DecimalArithmetic.java').is_file()
          assert "new MathContext(15,RoundingMode.HALF_UP)" in engine
          assert "9007199254740991d" in engine
          print('PASS: S CALC maths preserved, supplied 192px launcher icon and larger header verified')
          assert 'monogram.setContentDescription("S Vision logo")' in source
          print('PASS: Premium S-CALC icon is used by launcher and S VISION branding appears inside calculator')
          print('PASS: VISION CALC native Android app and permission-free offline code')
          PY

      - name: Compile and accuracy-test the Java calculation engine
        shell: bash
        run: |
          set -euo pipefail
          p="vision-scientific-calculator"
          src="$p/app/src/main/java/com/saurabhsvision/visioncalc"
          out="$RUNNER_TEMP/vision-calc-core"
          mkdir -p "$out"
          javac -encoding UTF-8 -d "$out" \
            "$src/ExpressionEngine.java" \
            "$src/UnitConverter.java" \
            "$p/tests/CalculatorCoreTest.java"
          java -ea -cp "$out" CalculatorCoreTest

      - name: Verify decimal precision, speed and scientific compatibility
        shell: bash
        run: |
          set -euo pipefail
          p="vision-scientific-calculator"
          src="$p/app/src/main/java/com/saurabhsvision/visioncalc"
          out="$RUNNER_TEMP/s-calc-precision"
          mkdir -p "$out"
          javac -encoding UTF-8 -d "$out" \
            "$src/ExpressionEngine.java" \
            "$src/DecimalArithmetic.java" \
            "$p/tests/CalculatorSpeedAccuracyTest.java"
          java -ea -cp "$out" CalculatorSpeedAccuracyTest

      - name: Verify 4 soft themes readability and persistence bounds
        shell: bash
        run: |
          set -euo pipefail
          p="vision-scientific-calculator"
          src="$p/app/src/main/java/com/saurabhsvision/visioncalc"
          out="$RUNNER_TEMP/s-calc-comfort"
          mkdir -p "$out"
          javac -encoding UTF-8 -d "$out" \
            "$src/ComfortTheme.java" \
            "$p/tests/ComfortThemeTest.java"
          java -ea -cp "$out" ComfortThemeTest

      - name: Test responsive keypad sizing on tall and short screens
        shell: bash
        run: |
          set -euo pipefail
          p="vision-scientific-calculator"
          src="$p/app/src/main/java/com/saurabhsvision/visioncalc"
          out="$RUNNER_TEMP/vision-calc-layout"
          mkdir -p "$out"
          javac -encoding UTF-8 -d "$out" \
            "$src/CalculatorLayoutPolicy.java" \
            "$p/tests/CalculatorLayoutPolicyTest.java"
          java -ea -cp "$out" CalculatorLayoutPolicyTest

      - name: Compile real Android APK
        shell: bash
        run: |
          cd vision-scientific-calculator
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK package and debug signature
        shell: bash
        run: |
          set -euo pipefail
          apk="vision-scientific-calculator/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.saurabhsvision.visioncalc'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q MainActivity
          mkdir -p calc-deliverables
          cp "$apk" calc-deliverables/S_CALC_Pro_v1.7.0_BIG_CLEAR_ICON.apk
          ( cd calc-deliverables && sha256sum *.apk > SHA256SUMS.txt )

      - name: Upload downloadable calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: S_CALC_Pro_v1_7_0_BIG_CLEAR_ICON_APK
          path: calc-deliverables/*
          retention-days: 90

      - name: Publish public GitHub test APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="s-calc-pro-v1.7.0"
          apk="calc-deliverables/S_CALC_Pro_v1.7.0_BIG_CLEAR_ICON.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" calc-deliverables/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "$apk" calc-deliverables/SHA256SUMS.txt \
              --title "S CALC Pro 1.7 • Bigger & Sharper S Icon" \
              --notes "S CALC Pro v1.7 by SAURABH'S VISION: The user-provided blue/green calculator artwork with red S is now the actual Android launcher and round icon. Optimized to a crisp 192x192 WebP, with surrounding white padding replaced by midnight navy so the logo fills more of its tile. In-app header logo enlarged from 46dp to 56dp. Original calculator engine, scientific functions, unit conversions, four comfort themes, history and offline privacy are preserved from v1.6. Automated Java maths, accuracy and speed tests, layout validation, APK signature and exact icon SHA256 verification pass on GitHub Actions. The beta Android APK still requires on-device confirmation. Debug signature may differ between builds and uninstalling previous apps can erase data." \
              --latest=false
          fi
