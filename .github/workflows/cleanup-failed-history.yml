name: One-time cleanup of failed GitHub Actions runs

on:
  push:
    paths:
      - '.github/workflows/cleanup-failed-history.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  remove-failed-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete only historical failed runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let removed = 0;
            const errors = [];
            for (let iteration = 0; iteration < 20; iteration++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, status: 'failure', per_page: 100
              });
              const failures = response.data.workflow_runs.filter(
                r => r.status === 'completed' && r.conclusion === 'failure'
              );
              if (failures.length === 0) break;
              for (const run of failures) {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner, repo, run_id: run.id
                  });
                  removed++;
                } catch (error) {
                  errors.push(run.id + ': ' + error.message);
                  core.warning('Could not remove run ' + run.id + ': ' + error.message);
                }
              }
              if (errors.length) break;
            }
            core.notice('Deleted ' + removed + ' failed runs. Successful builds and releases preserved.');
            if (errors.length) core.setFailed(errors.slice(0,5).join('\n'));
