name: Refresh S Browser attributed news bulletin

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 's-browser/tools/refresh_assembly_news.py'
      - 's-browser/tools/test_news_digest.py'
      - '.github/workflows/refresh-s-browser-news.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: s-browser-news-digest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate news sourcing, timestamps and HTTPS URLs
        run: python3 s-browser/tools/test_news_digest.py

      - name: Update latest attributed RSS headlines, never invent data
        run: python3 s-browser/tools/refresh_assembly_news.py

      - name: Publish small JSON update to main branch
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/s-browser-news/latest.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: update source-attributed S Browser school news bulletin"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not push news data" >&2
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
          # GITHUB_TOKEN pushes intentionally do not trigger push workflows.
          # workflow_dispatch is the official exception and deploys Pages.
          gh workflow run deploy-pages.yml --ref main

      - name: Log live-data coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('website/s-browser-news/latest.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          print({k:len(v['stories']) for k,v in j['feeds'].items()})
          PY
