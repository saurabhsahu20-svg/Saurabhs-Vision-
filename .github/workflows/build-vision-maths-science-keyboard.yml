name: Build Vision Maths and Science Keyboard APK

on:
  push:
    branches: [main]
    paths:
      - 'vision-maths-science-keyboard/**'
      - '.github/workflows/build-vision-maths-science-keyboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s-board-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Android IME keyboard APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use installed Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK 35
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Check working IME, four modes and privacy declarations
