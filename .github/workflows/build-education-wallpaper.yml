name: Build Education Live Wallpaper APK

on:
  push:
    branches: [main]
    paths:
      - 'education-live-wallpaper/**'
      - '.github/workflows/build-education-wallpaper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and package Vision Edu Walls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use runner's installed Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install platform and build tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Compile APK
        run: |
          cd education-live-wallpaper
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate Android APK and publishable binary
        shell: bash
        run: |
          set -euo pipefail
          apk="education-live-wallpaper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -10
          mkdir -p deliverables
          cp "$apk" deliverables/Vision_Edu_Walls_v5.1.0_SMART_WIDGETS_TEST.apk
          sha256sum deliverables/*.apk | tee deliverables/SHA256SUMS.txt

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vision_Edu_Walls_v5_1_Smart_Widgets_APK
          path: deliverables/*
          retention-days: 90

      - name: Publish a direct-download GitHub test Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="vision-edu-walls-v5.1.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release tag already exists; uploading test APK asset."
            gh release upload "$tag" deliverables/Vision_Edu_Walls_v5.1.0_SMART_WIDGETS_TEST.apk deliverables/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" deliverables/Vision_Edu_Walls_v5.1.0_SMART_WIDGETS_TEST.apk deliverables/SHA256SUMS.txt --title "Vision Edu Walls 5.1 • Smart Digital Clock Weather & Battery Widgets" --notes "Vision Edu Walls 5.1 test APK: 50 Android smart widget styles with actual phone digital clock (12h or 24h), system date, battery percentage and optionally current weather/temperature. Choose a city without location access or voluntarily grant approximate location; weather uses the Open-Meteo service and network only for weather. Weather may update around every 30 minutes, battery periodically. 50 static + 50 interactive live wallpaper presets and classic gallery retained. APK test/debug signing may differ; test on your phone." --latest=false
          fi
