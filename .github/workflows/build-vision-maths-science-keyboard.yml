name: Build Vision Maths and Science Keyboard APK

on:
  push:
    branches: [main]
    paths:
      - 'vision-maths-science-keyboard/**'
      - '.github/workflows/build-vision-maths-science-keyboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android IME keyboard APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use installed Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK 35
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Check working IME, four modes and privacy declarations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('vision-maths-science-keyboard/app/src/main')
          ime=(root/'java/com/saurabhsvision/keyboard/VisionKeyboardService.java').read_text()
          activity=(root/'java/com/saurabhsvision/keyboard/MainActivity.java').read_text()
          bg=(root/'java/com/saurabhsvision/keyboard/KeyboardBackdrop.java').read_text()
          manifest=(root/'AndroidManifest.xml').read_text()
          method=(root/'res/xml/method.xml').read_text()
          for token in ('extends InputMethodService','onCreateInputView','onStartInputView',
                        'getCurrentInputConnection','commitText','deleteSurroundingText',
                        'performEditorAction','addToolbar','addRow','startRepeat','KEY_THEME',
                        'π √ ∑ ∞','H₂O CO₂ O₂'):
              assert token in ime, ('Missing key or IME behavior',token)
          assert 'android.permission.BIND_INPUT_METHOD' in manifest
          assert 'android.view.InputMethod' in manifest
          assert 'android:resource="@xml/method"' in manifest
          assert 'settingsActivity' in method
          assert 'android.permission.INTERNET' not in manifest
          assert 'READ_CLIPBOARD' not in manifest
          assert 'RECORD_AUDIO' not in manifest
          assert 'ACTION_INPUT_METHOD_SETTINGS' in activity
          assert 'showInputMethodPicker' in activity
          assert 'S BOARD' in activity and 'Maths • Science' in activity
          panel=(root/'java/com/saurabhsvision/keyboard/KeyboardPanel.java').read_text()
          emojis=(root/'java/com/saurabhsvision/keyboard/EmojiCatalog.java').read_text()
          assert 'extends LinearLayout' in panel
          assert 'WRAP_CONTENT' in panel
          assert 'View.MeasureSpec.EXACTLY' in panel and 'setMeasuredDimension' in panel
          assert 'new KeyboardBackdrop(this,theme),' not in ime
          assert 'onEvaluateFullscreenMode(){return false;}' in ime
          assert 'keyboardFrame=new KeyboardPanel(this,theme)' in ime
          assert 'addEmojiCategories' in ime and 'addEmojiPage' in ime
          assert 'EMOJIS_PER_PAGE=32' in ime
          assert 'getCurrentInputConnection' in ime
          assert 'CATEGORIES' in emojis and 'Love' in emojis and 'Feelings' in emojis
          assert 'drawArtwork' in bg
          assert '0xfff5f8ff' in bg and 'if(theme==4)' in bg
          assert 'Math.floorMod(theme,5)' in bg
          assert 'theme=(theme+1)%5' in ime
          assert 'theme==4' in ime
          assert 'scaleX(.96f)' in ime
          assert 'setCornerRadius(dp(14))' in ime
          assert 'Pure White' in activity and 'keyPreview' in activity
          assert 'addKey(row,"Space","SPACE",4.35f' in ime
          assert 'SBoardKeyButton b=new SBoardKeyButton(this)' in ime
          assert 'Spacebar - insert space' in ime
          assert 'setCompact(settings().getBoolean("compact_height",true))' in ime
          assert 'resizeKeyChildren' in panel
          assert 'KeyboardLayoutPolicy.fit' in panel and 'onLayout(boolean changed' in panel
          assert 'Math.min(cap,View.MeasureSpec.getSize(heightSpec))' in panel
          assert 'Math.max(1,availableWidth' in panel
          assert 'Compact Keyboard (Recommended)' in activity
          assert 'Comfortable / Larger Keyboard' in activity
          assert (root/'java/com/saurabhsvision/keyboard/IndicLanguages.java').is_file()
          assert (root/'java/com/saurabhsvision/keyboard/OfflinePhonetic.java').is_file()
          assert 'mode=LANGUAGE' in ime
          assert 'addLanguagePicker' in ime
          assert 'addLanguageStatus' in ime
          assert 'setComposingText' in ime and 'finishComposingText' in ime
          assert 'isPasswordField' in ime
          assert 'romanComposing' in ime
          assert 'languageSpinner' in activity
          assert 'Hinglish' in activity
          from pathlib import Path
          logo=root/'res/drawable-nodpi/s_board_logo.webp'
          assert logo.is_file() and logo.stat().st_size>3000
          raw_logo=logo.read_bytes()
          assert raw_logo[:4]==b'RIFF' and raw_logo[8:12]==b'WEBP'
          
          splash=(root/'java/com/saurabhsvision/keyboard/SauneSplashActivity.java').read_text()
          manifest=(root/'AndroidManifest.xml').read_text()
          strings=(root/'res/values/strings.xml').read_text()
          assert 'SauneSplashActivity' in manifest and 's_board_logo' in manifest
          assert '<string name="app_name">S Board</string>' in strings
          assert 'ValueAnimator' in splash and 'R.drawable.s_board_logo' in splash
          assert 'handler.postDelayed(enterApp,2400)' in splash
          assert 'new Intent(this,MainActivity.class)' in splash
          assert 'animatedLogoBadge.setImageResource(R.drawable.s_board_logo)' in activity
          assert 'refreshSetupStatus()' in activity
          assert 'index==6){' in ime and 'theme=(theme+1)%5' in ime
          assert 'index==7?' in ime and 'Keyboard settings' in ime
          assert 'String[] ids={"ABC","123","∑ Math","⚛ Sci","😊","🌐","🎨","⚙"}' in ime
          assert 'by Saurabh' in ime
          assert 'SBoardKeyButton b=new SBoardKeyButton(this);' in ime
          assert 'setSpaceIndicator("SPACE".equals(output),light())' in ime
          assert 'getBoolean("show_suggestions",false)' in ime
          assert (root/'java/com/saurabhsvision/keyboard/SBoardKeyButton.java').is_file()
          assert 'Toggle Smart Suggestions' in activity
          assert 'setMeasuredDimension(width,Math.min(cap' in panel
          assert 'child.layout(x,y,x+w,y+height)' in panel
          assert 'addSuggestions()' in ime and 'WordSuggestions.get' in ime
          assert 'onUpdateSelection' in ime and 'applySuggestion' in ime
          assert 'S Board toolbar' in ime and 'R.drawable.s_board_logo' in ime
          assert 'addKey(row,"Space","SPACE",4.35f' in ime
          assert 'A↔अ' in ime and 'LANG_TOGGLE' in ime
          assert 'b.setOnLongClickListener' in ime
          assert 'portraitMaxDp=compact?330:365' in panel
          assert 'landscapeMaxDp=compact?305:340' in panel
          assert 'row.setTag("sboard_space_action")' in ime
          assert 'KeyboardLayoutPolicy.fit(desired,budget,dp(36),actionIndex)' in panel
          assert 'int height=dp(landscape?49:55);' in ime
          assert 'orientation==2?57:62' in ime
          assert 'keysContent.setPadding(dp(3),dp(5),dp(3),dp(landscape?58:22));' in ime
          assert 'boolean landscape=getResources().getConfiguration().orientation' in ime
          assert ime.index('addRow("Q W E R T Y U I O P");') < ime.index('addRow("A S D F G H J K L");') < ime.index('addRow("⇧ Z X C V B N M ⌫");') < ime.index('addBottom();')
          assert ime.index('addRow("Q W E R T Y U I O P");') < ime.index('addRow("A S D F G H J K L");') < ime.index('addRow("⇧ Z X C V B N M ⌫");') < ime.index('addBottom();')
          for lastrow in ('* \\" \' : ; ! ? = ← ⌫','sin( cos( tan( log( ln( x² x³ ^ → ⌫','α β γ λ μ Ω Δ ∝ ∴ ⌫'):
              assert lastrow in ime
          assert 'row.setTag("sboard_space_action")' in ime
          print('PASS: THREE complete letter rows followed by full-height Spacebar with 58dp landscape navigation safety')
          print('Full four-row S Board layout and enlarged keyboard viewport verified')
          assert (root/'java/com/saurabhsvision/keyboard/WordSuggestions.java').is_file()
          print('Confirmed neon input view, live suggestion strip, stable Spacebar and real long-press number keys')
          print('S Board branding, user-selected 3D logo image, animated splash and setup status verified')

          print('24 language choices, phonetic composition, secure-password fallback verified')
          print('Space/Enter bottom row priority, adaptive fit, compact settings verified')
          print('Verified five themes, Pure White contrast, professional button skins and preview.')
          print('Verified compact IME panel + paginated emoji picker source contracts.')
          assert 'extends View' in bg
          print('Keyboard functional/input/privacy contracts checked.')
          PY

      - name: Verify all 22 scheduled language modes and phonetic Hindi examples
        shell: bash
        run: |
          set -euo pipefail
          src="vision-maths-science-keyboard/app/src/main/java/com/saurabhsvision/keyboard"
          out="$RUNNER_TEMP/phonetic-smoke"
          mkdir -p "$out"
          javac -encoding UTF-8 -d "$out" \
            "$src/IndicLanguages.java" \
            "$src/OfflinePhonetic.java" \
            "vision-maths-science-keyboard/PhoneticSmokeTest.java"
          java -ea -cp "$out" PhoneticSmokeTest

      - name: Regression test spacebar always fits
        shell: bash
        run: |
          set -euo pipefail
          base="vision-maths-science-keyboard"
          src="$base/app/src/main/java/com/saurabhsvision/keyboard"
          out="$RUNNER_TEMP/keyboard-layout-test"
          mkdir -p "$out"
          javac -encoding UTF-8 -d "$out" "$src/KeyboardLayoutPolicy.java" "$base/KeyboardLayoutPolicySmokeTest.java"
          java -ea -cp "$out" KeyboardLayoutPolicySmokeTest

      - name: Test offline word suggestions without Android or Internet
        shell: bash
        run: |
          set -euo pipefail
          base="vision-maths-science-keyboard"
          src="$base/app/src/main/java/com/saurabhsvision/keyboard"
          out="$RUNNER_TEMP/s-board-word-suggestions"
          mkdir -p "$out"
          javac -encoding UTF-8 -d "$out" "$src/WordSuggestions.java" "$base/WordSuggestionsSmokeTest.java"
          java -ea -cp "$out" WordSuggestionsSmokeTest

      - name: Compile APK
        shell: bash
        run: |
          cd vision-maths-science-keyboard
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate installable APK, manifest and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="vision-maths-science-keyboard/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -13
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.saurabhsvision.keyboard'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q 'android.view.InputMethod'
          mkdir -p keyboard-deliverables
          cp "$apk" keyboard-deliverables/S_Board_v1.9.3_VISIBLE_SPACEBAR.apk
          sha256sum keyboard-deliverables/*.apk | tee keyboard-deliverables/SHA256SUMS.txt

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: S_Board_v1_9_3_Visible_Spacebar_APK
          path: keyboard-deliverables/*
          retention-days: 90

      - name: Publish direct-download GitHub test Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="s-board-v1.9.3"
          file="keyboard-deliverables/S_Board_v1.9.3_VISIBLE_SPACEBAR.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" keyboard-deliverables/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "$file" keyboard-deliverables/SHA256SUMS.txt \
              --title "S Board 1.9.3 • Last Row Visibility Fix" \
              --notes "S Board 1.9.3 fixes the cropped bottom row visible in the owner's real-device screenshot. It keeps the full 3 QWERTY letter rows and fourth Space/Enter row in their original order, but reserves a much larger landscape bottom-safe strip (58dp) above Android navigation controls, letting the final row rise within the keyboard viewport. Portrait retains a modest 22dp reserve. No letter, layout order, branding, Math, Science, emoji, or Hindi/Hinglish feature is removed. Automated regression tests validate all four keyboard rows, constrained viewport budgets, phonetic typing, Android APK compilation and signature. This is a debug-signed test APK; the final result must also be checked on the actual phone." \
              --latest=false
          fi
