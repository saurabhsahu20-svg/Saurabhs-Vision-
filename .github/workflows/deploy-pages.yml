name: Publish Saurabh Vision Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: saurabhs-vision-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish public website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create static publish directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saurabh-site"
          cp -a website/. "$RUNNER_TEMP/saurabh-site/"
          # Publish only public frontend; do not host backend logic or policies.
          rm -rf "$RUNNER_TEMP/saurabh-site/functions" \
                 "$RUNNER_TEMP/saurabh-site/tests" \
                 "$RUNNER_TEMP/saurabh-site/APP_IMPORT_GUIDE.md" \
                 "$RUNNER_TEMP/saurabh-site/APP_IMPORT_TEST_REPORT.md" \
                 "$RUNNER_TEMP/saurabh-site/firestore.rules" \
                 "$RUNNER_TEMP/saurabh-site/storage.rules" \
                 "$RUNNER_TEMP/saurabh-site/firestore.indexes.json" \
                 "$RUNNER_TEMP/saurabh-site/firebase.json"
          touch "$RUNNER_TEMP/saurabh-site/.nojekyll"
          test -f "$RUNNER_TEMP/saurabh-site/index.html"
          test -f "$RUNNER_TEMP/saurabh-site/app.js"
          if [ -d "$RUNNER_TEMP/saurabh-site/vision-app" ]; then
            test -f "$RUNNER_TEMP/saurabh-site/vision-app/index.html"
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/saurabh-site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
