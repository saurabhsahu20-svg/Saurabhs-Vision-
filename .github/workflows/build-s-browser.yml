name: Build S Browser Android APK

on:
  push:
    branches: [main]
    paths:
      - 's-browser/**'
      - '.github/workflows/build-s-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 's-browser/**'
      - '.github/workflows/build-s-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify offline dictionary and browser rules
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          javac -encoding UTF-8 -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/AddressResolver.java             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/DictionaryEntry.java             s-browser/tests/AddressResolverTest.java             s-browser/tests/DictionaryEntryTest.java
          java -ea -cp "$dir" AddressResolverTest
          java -ea -cp "$dir" DictionaryEntryTest
          javac -encoding UTF-8 -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/GovtSources.java             s-browser/tests/GovtSourcesTest.java
          java -ea -cp "$dir" GovtSourcesTest
          javac -encoding UTF-8 -cp "$dir" -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/CityNewsSources.java             s-browser/tests/CityNewsSourcesTest.java
          java -ea -cp "$dir" CityNewsSourcesTest
          javac -encoding UTF-8 -cp "$dir" -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/DailyAssemblyContent.java             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/DailyNewsSources.java             s-browser/tests/DailyAssemblyContentTest.java             s-browser/tests/DailyNewsSourcesTest.java
          java -ea -cp "$dir" DailyAssemblyContentTest
          java -ea -cp "$dir" DailyNewsSourcesTest
          python3 - <<'PY'
          from pathlib import Path
          dictionary=Path('s-browser/app/src/main/assets/dictionary.tsv')
          lines=[x for x in dictionary.read_text(encoding='utf-8').splitlines() if x and not x.startswith('#')]
          assert len(lines)>=300, f'Only {len(lines)} offline dictionary entries'
          assert all(len(x.split('\t'))==4 for x in lines), 'Malformed dictionary entry'
          words=[x.split('\t')[0].lower() for x in lines]
          assert len(set(words))==len(words), 'Duplicate dictionary words'
          print(f'PASS {len(lines)} offline dictionary entries')
          PY

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile S Browser debug APK
        working-directory: s-browser
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists and is signed
        shell: bash
        run: |
          set -euo pipefail
          APK="s-browser/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/S_Browser_v1.4.0_Daily_Assembly_Fun_Beta.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-Browser-1.4.0-APK
          path: dist/S_Browser_v1.4.0_Daily_Assembly_Fun_Beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta APK on GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="s-browser-v1.4.0-beta"
          FILE="dist/S_Browser_v1.4.0_Daily_Assembly_Fun_Beta.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "S Browser 1.4 Beta — Daily Assembly & Fun" \
              --notes "S Browser 1.4 introduces a dedicated point-wise Daily Assembly and Fun section for students: original rotating thought of the day, 14 short bilingual school speeches with Android text-to-speech, daily ready-to-read assembly script, attributed live Sports and Breaking/Latest news using date-filtered Google News RSS (24h/3d, Hindi/English, India/CG), optional zodiac-themed positive reflections clearly labeled entertainment (not scientific predictions), 3 playable 4x4 word-square crossword boards and 14 word scrambles with riddles, hints and answer checks. 21 thoughts, 304-term offline dictionary, earlier CG city news, government jobs/exams and browser features preserved. No fake headlines, verified breaking claims, unsubstantiated astrology predictions, tracking or ads. This is a debug beta: build checks cannot replace real-device browser tests or guarantee a live feed is always available." \
              --prerelease
          fi
