name: Build S Browser Android APK

on:
  push:
    branches: [main]
    paths:
      - 's-browser/**'
      - '.github/workflows/build-s-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify offline dictionary and browser rules
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          javac -encoding UTF-8 -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/AddressResolver.java             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/DictionaryEntry.java             s-browser/tests/AddressResolverTest.java             s-browser/tests/DictionaryEntryTest.java
          java -ea -cp "$dir" AddressResolverTest
          java -ea -cp "$dir" DictionaryEntryTest
          python3 - <<'PY'
          from pathlib import Path
          dictionary=Path('s-browser/app/src/main/assets/dictionary.tsv')
          lines=[x for x in dictionary.read_text(encoding='utf-8').splitlines() if x and not x.startswith('#')]
          assert len(lines)>=150, f'Only {len(lines)} offline dictionary entries'
          assert all(len(x.split('\t'))==4 for x in lines), 'Malformed dictionary entry'
          words=[x.split('\t')[0].lower() for x in lines]
          assert len(set(words))==len(words), 'Duplicate dictionary words'
          print(f'PASS {len(lines)} offline dictionary entries')
          PY

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile S Browser debug APK
        working-directory: s-browser
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists and is signed
        shell: bash
        run: |
          set -euo pipefail
          APK="s-browser/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/S_Browser_v0.1.0_Student_Dictionary_Beta.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-Browser-0.1.0-APK
          path: dist/S_Browser_v0.1.0_Student_Dictionary_Beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta APK on GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="s-browser-v0.1.0-beta"
          FILE="dist/S_Browser_v0.1.0_Student_Dictionary_Beta.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE"               --title "S Browser 0.1 Beta — Student Dictionary"               --notes "S Browser beta by SAURABH'S VISION. Native Android WebView, up to 8 tabs, bookmarks, history, downloads, focus mode, reading mode, per-page study notes and 168 curated offline English–Hindi dictionary entries. Uses the approved neon S Browser launcher icon. Debug-signed beta APK. Not a fully audited browser; does not provide strict incognito isolation, full content blocking or an AI tutor. Test sites and downloads on your phone before daily use."               --prerelease
          fi
