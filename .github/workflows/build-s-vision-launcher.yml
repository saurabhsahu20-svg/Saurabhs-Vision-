name: Build S VISION Maths & Science Launcher APK

on:
  push:
    branches: [main]
    paths:
      - 'science-maths-launcher/**'
      - '.github/workflows/build-s-vision-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s-vision-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test Launcher and Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Check functional Android HOME, theme and privacy code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('science-maths-launcher')
          mf=(p/'app/src/main/AndroidManifest.xml').read_text()
          activity=(p/'app/src/main/java/com/saurabhsvision/launcher/MainActivity.java').read_text()
          wallpaper=(p/'app/src/main/java/com/saurabhsvision/launcher/ScienceWallpaperView.java').read_text()
          assert 'android.intent.category.HOME' in mf
          assert 'android.intent.category.DEFAULT' in mf
          assert 'android.intent.category.LAUNCHER' in mf
          assert 'android.intent.action.MAIN' in mf
          assert 'android:exported="true"' in mf
          assert '<queries>' in mf
          for forbidden in ('QUERY_ALL_PACKAGES','android.permission.INTERNET',
              'READ_CONTACTS','ACCESS_FINE_LOCATION','RECORD_AUDIO'):
              assert forbidden not in mf, forbidden
          assert 'android:allowBackup="false"' in mf
          assert 'package com.saurabhsvision.launcher;' in activity
          for method in ('queryIntentActivities(', 'startActivity(launch)',
              'RoleManager.ROLE_HOME','Settings.ACTION_HOME_SETTINGS',
              'renderAppGrid(', 'toggleFavorite(', 'showThemes(',
              'showLearningLab(', 'onNewIntent(', 'setOnApplyWindowInsetsListener',
              'Intent.ACTION_DIAL', 'Intent.ACTION_SENDTO'):
              assert method in activity, method
          assert 'Maths' in (p/'README.md').read_text()
          assert len(wallpaper)>2000 and '"Cosmic Mathematics"' in wallpaper
          assert '"Atomic Science"' in wallpaper
          assert '"DNA Galaxy"' in wallpaper
          assert '"Golden Equations"' in wallpaper
          assert '"Pearl Light • Maths & Science"' in wallpaper
          assert 'theme==4){drawPearlLight(canvas,w,h);return;}' in wallpaper
          assert 'private void drawPearlLight(Canvas canvas,int w,int h)' in wallpaper
          assert 'private void buildLightHome(LinearLayout column)' in activity
          assert 'private void buildLightDock(LinearLayout column)' in activity
          assert 'if(lightTheme())buildLightHome(column)' in activity
          assert 'prefs.getInt(PREF_THEME,4)' in activity
          assert 'getSystemWindowInsetBottom()' in activity
          assert 'View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR' in activity
          assert 'View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR' in activity
          for functional in ('tryOpenInstalled("s calc","calculator","calc")',
               'showQuickNotes()', 'showLearningLab(idx==2?1:0)',
               'Intent.ACTION_DIAL', 'Uri.parse("smsto:")',
               'MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA',
               'if(lightTheme())tile.setBackground('):
              assert functional in activity, functional
          for visual in ('"Maths &"', '"Science"', '"LAUNCHER"',
               '"Calculator","Notes","Science","Maths"',
               'brandImage.setImageResource(R.drawable.svision_red_brand)',
               'emblem.setImageResource(R.drawable.svision_red_brand)'):
              assert visual in activity, visual
          logo=(p/'app/src/main/res/drawable-nodpi/svision_red_brand.webp').read_bytes()
          assert logo[:4]==b'RIFF' and logo[8:12]==b'WEBP' and len(logo)>3000
          assert 'android:icon="@drawable/svision_red_brand"' in mf
          assert 'android:roundIcon="@drawable/svision_red_brand"' in mf
          assert "versionName '1.2.0'" in (p/'app/build.gradle').read_text()
          print('PASS: exact user-supplied red 3D S Vision logo packaged and wired as HOME icon')
          print('PASS: HOME intent, app drawer, scoped package discovery, search, pinned favorites')
          print('PASS: 5 offline Maths/Science themes including Pearl Light and functional shortcuts')
          print('PASS: No sensitive permissions or Internet access')
          PY

      - name: Test offline theme selection and app search rules
        shell: bash
        run: |
          set -euo pipefail
          p="science-maths-launcher"
          src="$p/app/src/main/java/com/saurabhsvision/launcher"
          out="$RUNNER_TEMP/svision-launcher-test"
          mkdir -p "$out"
          javac -encoding UTF-8 -d "$out" "$src/LauncherRules.java" \
            "$p/tests/LauncherRulesTest.java"
          java -ea -cp "$out" LauncherRulesTest

      - name: Compile real Android Launcher APK
        shell: bash
        run: |
          cd science-maths-launcher
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify package, HOME capability and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="science-maths-launcher/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep "package: name='com.saurabhsvision.launcher'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml |
            grep -q "android.intent.category.HOME"
          mkdir -p launcher-deliverables
          cp "$apk" launcher-deliverables/S_VISION_LAUNCHER_v1.2.0_RED_S_VISION_LOGO.apk
          ( cd launcher-deliverables && sha256sum *.apk > SHA256SUMS.txt )

      - name: Upload Launcher APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: S_VISION_Launcher_v1_2_0_Red_S_Logo_APK
          path: launcher-deliverables/*
          retention-days: 90

      - name: Publish publicly downloadable GitHub test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="s-vision-launcher-v1.2.0"
          apk="launcher-deliverables/S_VISION_LAUNCHER_v1.2.0_RED_S_VISION_LOGO.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" launcher-deliverables/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "$apk" launcher-deliverables/SHA256SUMS.txt \
              --title "S VISION Launcher 1.2 • Official Red S Brand + Pearl Light HOME" \
              --notes "S VISION Launcher 1.2: Uses the user's actual uploaded red metallic 3D S SAURABH'S VISION logo both as the Android launcher icon (including round icon) and the header logo on the Pearl Light Maths & Science Home. Retains original scientific wallpaper, live local clock/date/battery, functional app search, four educational shortcuts, five dock actions, app drawer, favorites, and four existing dark themes. Uses locally embedded small WebP of the user-provided image: no network requests, permissions or ads. Tests verify actual binary image signature, Android manifest icon references, both home screen usages and normal launcher functions before compiling and signing the APK. This is a public debug-signed testing APK; phone launcher icon appearance can vary by OEM masking. No fake weather information is displayed." \
              --latest=false
          fi
