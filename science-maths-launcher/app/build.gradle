plugins {
    id 'com.android.application'
}
android {
    namespace 'com.saurabhsvision.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.saurabhsvision.launcher'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
