plugins {
    id 'com.android.application'
}
android {
    namespace 'com.saurabhsvision.keyboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.saurabhsvision.keyboard'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.6.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
