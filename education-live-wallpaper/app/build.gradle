plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saurabhsvision.eduwalls'
    compileSdk 35

    defaultConfig {
        applicationId 'com.saurabhsvision.eduwalls'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '6.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
