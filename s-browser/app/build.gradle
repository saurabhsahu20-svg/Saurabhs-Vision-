plugins { id 'com.android.application' }

// Set all four signing variables to use the SAME owner-controlled signing key
// across releases. Never commit any keystore or passwords to this repository.
// Without them, GitHub's auto-generated DEBUG key may vary between builds;
// Android will then refuse to install the next APK over an existing version.
def stableKeyFile = System.getenv('GRIFLY_KEYSTORE_FILE')
def stableKeyPassword = System.getenv('GRIFLY_KEYSTORE_PASSWORD')
def stableKeyAlias = System.getenv('GRIFLY_KEY_ALIAS')
def stableAliasPassword = System.getenv('GRIFLY_KEY_PASSWORD')
def stableSigning = [stableKeyFile, stableKeyPassword, stableKeyAlias, stableAliasPassword]
    .every { it != null && !it.isEmpty() } &&
    (stableKeyFile != null && file(stableKeyFile).exists())

android {
    namespace 'com.saurabhsvision.sbrowser'
    compileSdk 35
    defaultConfig {
        applicationId 'com.saurabhsvision.sbrowser'
        minSdk 26
        targetSdk 34
        versionCode 24
        versionName '1.9.5-beta'
    }
    signingConfigs {
        if (stableSigning) {
            stableRelease {
                storeFile file(stableKeyFile)
                storePassword stableKeyPassword
                keyAlias stableKeyAlias
                keyPassword stableAliasPassword
            }
        }
    }
    buildTypes {
        debug {
            // Native Android in-place updates are possible only when the
            // installed app and the new APK have identical signing identity.
            if (stableSigning) signingConfig signingConfigs.stableRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

 
// Generate the small WebP resource deterministically from the checked-in
// rainbow S artwork. No external image URL or network dependency required.
android.sourceSets.main.res.srcDir("$buildDir/generated/rainbowLogo")
tasks.register('generateRainbowLogo') {
    inputs.file('src/main/assets/rainbow_s_logo.b64')
    outputs.file("$buildDir/generated/rainbowLogo/drawable-nodpi/rainbow_s_icon.webp")
    doLast {
        def destination = file("$buildDir/generated/rainbowLogo/drawable-nodpi/rainbow_s_icon.webp")
        destination.parentFile.mkdirs()
        destination.bytes = java.util.Base64.getMimeDecoder().decode(
            file('src/main/assets/rainbow_s_logo.b64').text)
    }
}
tasks.named('preBuild').configure {
    dependsOn(tasks.named('generateRainbowLogo'))
}
