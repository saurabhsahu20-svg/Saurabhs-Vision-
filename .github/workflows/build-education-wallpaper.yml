name: Build Education Live Wallpaper APK

on:
  push:
    branches: [main]
    paths:
      - 'education-live-wallpaper/**'
      - '.github/workflows/build-education-wallpaper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and package Vision Edu Walls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use runner's installed Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install platform and build tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Validate 66 static + 66 live + 60 widget catalogs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('education-live-wallpaper/app/src/main/java/com/saurabhsvision/eduwalls')
          for filename,token in [('CollectionCatalog.java','NAMES'),('LiveSceneCatalog.java','TITLES'),('WidgetCatalog.java','NAMES')]:
              data=(base/filename).read_text(encoding='utf8')
              start=data.find('String[][] '+token)
              assert start>=0,filename
              names=re.findall(r'"([^"]+)"',data[start:data.find(';',start)])
              expected=60 if filename=='WidgetCatalog.java' else 50
              assert len(names)==expected,(filename,len(names),expected)
              assert len(set(names))==expected,(filename,'non-distinct names')
              print(filename,':',expected,'unique named designs')
          data=(base/'BiologyCatalog.java').read_text(encoding='utf8')
          start=data.find('String[] NAMES')
          assert start>=0
          biology=re.findall(r'"([^"]+)"',data[start:data.find(';',start)])
          assert len(biology)==16,(len(biology),'biology catalog must have 16 distinct topics')
          assert len(set(biology))==16
          assert 'class BiologyPainter' in (base/'BiologyPainter.java').read_text(encoding='utf8')
          activity=(base/'V5StudioActivity.java').read_text(encoding='utf8')
          engine=(base/'EduWallpaperService.java').read_text(encoding='utf8')
          assert 'STATIC_COUNT=CollectionCatalog.COUNT+BiologyCatalog.COUNT' in activity
          assert 'LIVE_COUNT=LiveSceneCatalog.COUNT+BiologyCatalog.COUNT' in activity
          assert 'bioScenes.draw' in engine
          assert 'PREMIUM 3D HD ART STUDIO' in (base/'ImagePackActivity.java').read_text()
          assert 'PremiumWidgetArt.background' in (base/'VisionWidgetProvider.java').read_text()
          assert 'drawPremiumArtEffects' in (base/'EducationPainter.java').read_text()
          assert 'PremiumWidgetArt.choose' in (base/'ImagePackActivity.java').read_text()
          assert 'premium_hd_fx' in (base/'ImagePackActivity.java').read_text()
          print('Verified Premium 3D HD Studio, real Android widget art, four live FX')
          assert 'class BuiltIn3DWidgetArt' in (base/'BuiltIn3DWidgetArt.java').read_text()
          widget=(base/'VisionWidgetProvider.java').read_text()
          setup=(base/'VisionWidgetSetupActivity.java').read_text()
          social=(base/'SocialLinks.java').read_text()
          assert 'https://www.instagram.com/saurabhs_vision/' in social
          assert 'Intent.ACTION_VIEW' in social
          assert 'SocialLinks.openInstagram(this)' in (base/'V5StudioActivity.java').read_text()
          assert 'SocialLinks.openInstagram(this)' in (base/'Premium100Activity.java').read_text()
          print('Verified user Instagram profile link is wired to both app screens')
          activity3d=(base/'Premium100Activity.java').read_text()
          painter=(base/'EducationPainter.java').read_text()
          assert 'BuiltIn3DWidgetArt.background(ctx,art,480,280)' in widget
          assert 'getInt("art_"+widgetId,-1)' in widget
          assert 'editor.putInt("art_"+id,art)' in widget
          assert 'for(int i=0;i<100;i++)' in setup
          assert 'VisionWidgetProvider.setWidget(this,widgetId,style,art)' in setup
          assert 'getInt("pending_art",-1)' in setup
          assert 'applyLive(file,index)' in activity3d
          assert 'applyWidget(index)' in activity3d
          assert 'requestPinAppWidget' in activity3d
          assert 'putInt("premium_3d_index",index)' in activity3d
          assert 'drawPremium3DMatchedEffects' in painter
          print('V10 verified: all 100 separate Live presets + per-widget 3D image skins + phone data')
          assert 'class Premium100Activity' in (base/'Premium100Activity.java').read_text(encoding='utf8')
          print('Verified: 66 static, 66 live, 60 widgets + separate 100 built-in Premium 3D gallery')
          assert 'class StillScenePainter' in (base/'StillScenePainter.java').read_text()
          assert 'class LiveScenePainter' in (base/'LiveScenePainter.java').read_text()
          xml=Path('education-live-wallpaper/app/src/main/res/layout/vision_widget.xml').read_text()
          for name in ('widget_clock','widget_date','widget_battery','widget_weather','widget_city'):
              assert name in xml,name
          PY

      - name: Unpack and verify 100 pre-installed 3D wallpapers
        shell: bash
        run: |
          set -euo pipefail
          cd education-live-wallpaper
          cat premium100-pack/part*.bin > /tmp/vision-edu-walls-100.zip
          echo "3ecad47de80e800a2c2750d7c0701ad649864737a2fd578fa81d9d20e00b71ab  /tmp/vision-edu-walls-100.zip" | sha256sum --check
          python3 - <<'PY'
          import hashlib,io,json,zipfile
          from pathlib import Path
          source=Path('/tmp/vision-edu-walls-100.zip')
          destination=Path('app/src/main/assets/premium100')
          destination.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(source,'r') as archive:
              assert archive.testzip() is None, 'corrupt built-in art archive'
              names=[n for n in archive.namelist() if n.lower().endswith('.jpg')]
              assert len(names)==100, ('Expected 100 actual JPEGs',len(names))
              assert len(set(names))==100
              catalog=json.loads(archive.read('catalog.json'))
              assert len(catalog)==100 and len(set(x['file'] for x in catalog))==100
              assert set(x['file'] for x in catalog)==set(names)
              assert len(set(x['name'] for x in catalog))==100
              for i,entry in enumerate(catalog):
                  assert entry['index']==i+1
                  assert entry['category'] and entry['name']
                  name=entry['file']
                  assert '/' not in name and '\\\\' not in name
                  image=archive.read(name)
                  assert image[:2]==bytes([255,216]) and image[-2:]==bytes([255,217]),name
                  (destination/name).write_bytes(image)
              (destination/'catalog.json').write_bytes(archive.read('catalog.json'))
          print('Verified 100 original JPEG files, 100 unique names, 10 categories. All embedded into APK assets.')
          PY
          test "$(find app/src/main/assets/premium100 -name '*.jpg' | wc -l)" -eq 100

      - name: Compile APK
        run: |
          cd education-live-wallpaper
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate Android APK and publishable binary
        shell: bash
        run: |
          set -euo pipefail
          apk="education-live-wallpaper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -1
          python3 - "$apk" <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names=archive.namelist()
              bundled=[n for n in names if n.startswith('assets/premium100/') and n.endswith('.jpg')]
              assert len(bundled)==100,('Missing built-in files',len(bundled))
              manifest=json.loads(archive.read('assets/premium100/catalog.json'))
              assert len(manifest)==100
              print('APK includes all 100 real JPEG assets, no external ZIP required')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -10
          mkdir -p deliverables
          cp "$apk" deliverables/Vision_Edu_Walls_v10.1.0_INSTAGRAM_TEST.apk
          sha256sum deliverables/*.apk | tee deliverables/SHA256SUMS.txt

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vision_Edu_Walls_v10_1_Instagram_APK
          path: deliverables/*
          retention-days: 90

      - name: Publish a direct-download GitHub test Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="vision-edu-walls-v10.1.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release tag already exists; uploading test APK asset."
            gh release upload "$tag" deliverables/Vision_Edu_Walls_v10.1.0_INSTAGRAM_TEST.apk deliverables/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" deliverables/Vision_Edu_Walls_v10.1.0_INSTAGRAM_TEST.apk deliverables/SHA256SUMS.txt --title "Vision Edu Walls 10.1 • Instagram Profile Link" --notes "Vision Edu Walls 10.1 TEST APK: adds Follow @saurabhs_vision Instagram links on the home studio and 100 3D gallery. Tapping opens the user-supplied public profile in the Instagram app or browser; no Instagram login or account data access. Keeps 100 embedded 3D images, matching Live presets, digital widget backgrounds and classic collections. Build/signature verified by GitHub CI; device installation not yet verified." --latest=false
          fi
