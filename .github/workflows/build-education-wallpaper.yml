name: Build Education Live Wallpaper APK

on:
  push:
    branches: [main]
    paths:
      - 'education-live-wallpaper/**'
      - '.github/workflows/build-education-wallpaper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and package Vision Edu Walls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use runner's installed Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install platform and build tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Validate 66 static + 66 live + 60 widget catalogs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('education-live-wallpaper/app/src/main/java/com/saurabhsvision/eduwalls')
          for filename,token in [('CollectionCatalog.java','NAMES'),('LiveSceneCatalog.java','TITLES'),('WidgetCatalog.java','NAMES')]:
              data=(base/filename).read_text(encoding='utf8')
              start=data.find('String[][] '+token)
              assert start>=0,filename
              names=re.findall(r'"([^"]+)"',data[start:data.find(';',start)])
              expected=60 if filename=='WidgetCatalog.java' else 50
              assert len(names)==expected,(filename,len(names),expected)
              assert len(set(names))==expected,(filename,'non-distinct names')
              print(filename,':',expected,'unique named designs')
          data=(base/'BiologyCatalog.java').read_text(encoding='utf8')
          start=data.find('String[] NAMES')
          assert start>=0
          biology=re.findall(r'"([^"]+)"',data[start:data.find(';',start)])
          assert len(biology)==16,(len(biology),'biology catalog must have 16 distinct topics')
          assert len(set(biology))==16
          assert 'class BiologyPainter' in (base/'BiologyPainter.java').read_text(encoding='utf8')
          activity=(base/'V5StudioActivity.java').read_text(encoding='utf8')
          engine=(base/'EduWallpaperService.java').read_text(encoding='utf8')
          assert 'STATIC_COUNT=CollectionCatalog.COUNT+BiologyCatalog.COUNT' in activity
          assert 'LIVE_COUNT=LiveSceneCatalog.COUNT+BiologyCatalog.COUNT' in activity
          assert 'bioScenes.draw' in engine
          assert 'PREMIUM 3D HD ART STUDIO' in (base/'ImagePackActivity.java').read_text()
          assert 'PremiumWidgetArt.background' in (base/'VisionWidgetProvider.java').read_text()
          assert 'drawPremiumArtEffects' in (base/'EducationPainter.java').read_text()
          assert 'PremiumWidgetArt.choose' in (base/'ImagePackActivity.java').read_text()
          assert 'premium_hd_fx' in (base/'ImagePackActivity.java').read_text()
          print('Verified Premium 3D HD Studio, real Android widget art, four live FX')
          print('Verified: 66 static, 66 live, 60 widgets; 16 biology models')
          assert 'class StillScenePainter' in (base/'StillScenePainter.java').read_text()
          assert 'class LiveScenePainter' in (base/'LiveScenePainter.java').read_text()
          xml=Path('education-live-wallpaper/app/src/main/res/layout/vision_widget.xml').read_text()
          for name in ('widget_clock','widget_date','widget_battery','widget_weather','widget_city'):
              assert name in xml,name
          PY

      - name: Compile APK
        run: |
          cd education-live-wallpaper
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate Android APK and publishable binary
        shell: bash
        run: |
          set -euo pipefail
          apk="education-live-wallpaper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -10
          mkdir -p deliverables
          cp "$apk" deliverables/Vision_Edu_Walls_v8.0.0_PREMIUM_3D_TEST.apk
          sha256sum deliverables/*.apk | tee deliverables/SHA256SUMS.txt

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vision_Edu_Walls_v8_Premium_3D_APK
          path: deliverables/*
          retention-days: 90

      - name: Publish a direct-download GitHub test Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="vision-edu-walls-v8.0.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release tag already exists; uploading test APK asset."
            gh release upload "$tag" deliverables/Vision_Edu_Walls_v8.0.0_PREMIUM_3D_TEST.apk deliverables/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" deliverables/Vision_Edu_Walls_v8.0.0_PREMIUM_3D_TEST.apk deliverables/SHA256SUMS.txt --title "Vision Edu Walls 8.0 • Premium 3D HD Wallpapers, Live FX and Real Digital Widgets" --notes "Premium 3D HD Studio test APK: use separately supplied original HD ZIP art pack (not pre-embedded) to select colorful 3D wallpapers for Android static backgrounds, animated Live overlays with stardust/comets/neon orbits/minimal modes, and matching glass-style Digital Widget backgrounds. Real system clock, date, battery, optional Internet weather. Preserves 66 static, 66 live, 60 widget styles and Biology Atlas. Device testing required; debug signatures may differ from older test builds." --latest=false
          fi
