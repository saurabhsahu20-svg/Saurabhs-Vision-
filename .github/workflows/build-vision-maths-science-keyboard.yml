          out="$RUNNER_TEMP/s-board-cartoon-theme-test"
          mkdir -p "$out"
          javac -encoding UTF-8 -d "$out" \
            "$src/ThemePalette.java" "$src/EmojiCatalog.java" \
            "$base/ThemeEmojiSmokeTest.java"
          java -ea -cp "$out" ThemeEmojiSmokeTest

