name: Build S Browser Android APK

on:
  push:
    branches: [main]
    paths:
      - 's-browser/**'
      - '.github/workflows/build-s-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s-browser-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Validate offline dictionary, icon and privacy defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('s-browser')
          rows=[line.split('\t') for line in (root/'app/src/main/assets/dictionary.tsv').read_text().splitlines() if line.strip() and not line.startswith('#')]
          assert len(rows)>=250,len(rows)
          assert all(len(x)==4 and all(x) for x in rows)
          assert len({x[0] for x in rows})==len(rows)
          assert (root/'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png').is_file()
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text()
          assert 'android:label="S Browser"' in manifest
          assert 'usesCleartextTraffic="false"' in manifest
          assert 'android.permission.INTERNET' in manifest
          assert 'READ_CONTACTS' not in manifest
          assert 'RECORD_AUDIO' not in manifest
          assert 'READ_SMS' not in manifest
          source=(root/'app/src/main/java/com/saurabhsvision/sbrowser/MainActivity.java').read_text()
          for token in ('setSafeBrowsingEnabled(true)', 'setAllowFileAccess(false)',
              'setAcceptThirdPartyCookies(web,false)', 'handler.cancel()',
              'shouldOverrideUrlLoading(', 'DownloadManager.Request', 'newTab()',
              'openDictionary(', 'showTabs()', 'listSaved(', 'lookupSelection()'):
              assert token in source,token
          print(f'PASS dictionary ({len(rows)} entries), launcher icon, privacy defaults and working browser sources')
          PY

      - name: Run Java dictionary and URL regression tests
        run: |
          set -e
          out="$(mktemp -d)"
          src='s-browser/app/src/main/java/com/saurabhsvision/sbrowser'
          javac -encoding UTF-8 -d "$out" "$src/UrlTools.java" "$src/DictionaryCore.java" s-browser/tests/BrowserCoreTest.java
          java -ea -cp "$out" BrowserCoreTest

      - name: Build S Browser debug APK
        run: gradle -p s-browser --no-daemon :app:assembleDebug

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -e
          apk='s-browser/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.saurabhsvision.sbrowser'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" S_Browser_v1.0.0_BETA.apk
          sha256sum S_Browser_v1.0.0_BETA.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-Browser-v1.0.0-beta-APK
          path: S_Browser_v1.0.0_BETA.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public beta APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -e
          tag='s-browser-v1.0.0-beta'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" S_Browser_v1.0.0_BETA.apk --clobber
          else
            gh release create "$tag" S_Browser_v1.0.0_BETA.apk \
              --title 'S Browser v1.0.0 Beta — Inbuilt Offline Dictionary' \
              --notes 'S Browser by SAURABH\x27S VISION. HTTPS-first Android WebView browser with 8 tabs, bookmarks, history, study shortcuts, file uploads, downloads, Google/Bing/DuckDuckGo search and a bundled 260-word English/Hindi study dictionary with offline word lookup and device TTS pronunciation. No AI assistant, real private mode, extensions or recording. This is a debug-signed beta and needs real phone testing.' \
              --prerelease
          fi
