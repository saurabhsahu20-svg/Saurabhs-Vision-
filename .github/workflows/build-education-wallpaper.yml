name: Build Education Live Wallpaper APK

on:
  push:
    branches: [main]
    paths:
      - 'education-live-wallpaper/**'
      - '.github/workflows/build-education-wallpaper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and package Vision Edu Walls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use runner's installed Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install platform and build tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Verify 50 distinct static, live and widget catalogs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('education-live-wallpaper/app/src/main/java/com/saurabhsvision/eduwalls')
          for filename,token in [('CollectionCatalog.java','NAMES'),('LiveSceneCatalog.java','TITLES'),('WidgetCatalog.java','NAMES')]:
              data=(base/filename).read_text(encoding='utf8')
              start=data.find('String[][] '+token)
              assert start>=0,filename
              names=re.findall(r'"([^"]+)"',data[start:data.find(';',start)])
              assert len(names)==50,(filename,len(names))
              assert len(set(names))==50,(filename,'non-distinct names')
              print(filename,': 50 named artworks/styles')
          assert 'class StillScenePainter' in (base/'StillScenePainter.java').read_text()
          assert 'class LiveScenePainter' in (base/'LiveScenePainter.java').read_text()
          xml=Path('education-live-wallpaper/app/src/main/res/layout/vision_widget.xml').read_text()
          for name in ('widget_clock','widget_date','widget_battery','widget_weather','widget_city'):
              assert name in xml,name
          PY

      - name: Compile APK
        run: |
          cd education-live-wallpaper
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate Android APK and publishable binary
        shell: bash
        run: |
          set -euo pipefail
          apk="education-live-wallpaper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -10
          mkdir -p deliverables
          cp "$apk" deliverables/Vision_Edu_Walls_v6.0.0_150_DISTINCT_TEST.apk
          sha256sum deliverables/*.apk | tee deliverables/SHA256SUMS.txt

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vision_Edu_Walls_v6_150_Distinct_APK
          path: deliverables/*
          retention-days: 90

      - name: Publish a direct-download GitHub test Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="vision-edu-walls-v6.0.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release tag already exists; uploading test APK asset."
            gh release upload "$tag" deliverables/Vision_Edu_Walls_v6.0.0_150_DISTINCT_TEST.apk deliverables/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" deliverables/Vision_Edu_Walls_v6.0.0_150_DISTINCT_TEST.apk deliverables/SHA256SUMS.txt --title "Vision Edu Walls 6.0 • 50 Different Static + 50 Live + 50 Smart Widgets" --notes "Vision Edu Walls 6.0 test: 50 individual original static school posters, 50 separately rendered animated live scenes (not repeated static backgrounds), 50 distinct Android digital widgets with system clock/date/battery and opt-in live weather, with Classic collection and HD ZIP importer preserved. Requires real-device verification. Existing debug signing keys may differ." --latest=false
          fi
