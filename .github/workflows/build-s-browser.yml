name: Build S Browser Android APK

on:
  push:
    branches: [main]
    paths:
      - 's-browser/**'
      - '.github/workflows/build-s-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 's-browser/**'
      - '.github/workflows/build-s-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify offline dictionary and browser rules
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          javac -encoding UTF-8 -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/AddressResolver.java             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/DictionaryEntry.java             s-browser/tests/AddressResolverTest.java             s-browser/tests/DictionaryEntryTest.java
          java -ea -cp "$dir" AddressResolverTest
          java -ea -cp "$dir" DictionaryEntryTest
          javac -encoding UTF-8 -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/GovtSources.java             s-browser/tests/GovtSourcesTest.java
          java -ea -cp "$dir" GovtSourcesTest
          javac -encoding UTF-8 -cp "$dir" -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/CityNewsSources.java             s-browser/tests/CityNewsSourcesTest.java
          java -ea -cp "$dir" CityNewsSourcesTest
          javac -encoding UTF-8 -cp "$dir" -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/DailyAssemblyContent.java             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/DailyNewsSources.java             s-browser/tests/DailyAssemblyContentTest.java             s-browser/tests/DailyNewsSourcesTest.java
          java -ea -cp "$dir" DailyAssemblyContentTest
          java -ea -cp "$dir" DailyNewsSourcesTest
          javac -encoding UTF-8 -cp "$dir" -d "$dir"             s-browser/app/src/main/java/com/saurabhsvision/sbrowser/NewsQualityGate.java             s-browser/tests/NewsQualityGateTest.java
          java -ea -cp "$dir" NewsQualityGateTest
          python3 - <<'PY'
          from pathlib import Path
          dictionary=Path('s-browser/app/src/main/assets/dictionary.tsv')
          lines=[x for x in dictionary.read_text(encoding='utf-8').splitlines() if x and not x.startswith('#')]
          assert len(lines)>=300, f'Only {len(lines)} offline dictionary entries'
          assert all(len(x.split('\t'))==4 for x in lines), 'Malformed dictionary entry'
          words=[x.split('\t')[0].lower() for x in lines]
          assert len(set(words))==len(words), 'Duplicate dictionary words'
          print(f'PASS {len(lines)} offline dictionary entries')
          PY
          python3 - <<'PY'
          from pathlib import Path
          source=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/MainActivity.java').read_text(encoding='utf-8')
          assert 'Saurabh Vision Learning App' in source, 'Owner learning shortcut missing'
          assert 'https://saurabhsahu20-svg.github.io/Saurabhs-Vision-/vision-app/' in source, 'Owner learning app URL missing'
          legacy=['https://ncert.nic.in/','https://www.khanacademy.org/','https://www.wikipedia.org/','https://scholar.google.com/']
          assert not any(x in source for x in legacy), 'Legacy learning shortcuts still on homepage'
          print('PASS owner learning app replaces all external education shortcuts')
          PY
          python3 - <<'PY'
          from pathlib import Path
          main=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/MainActivity.java').read_text(encoding='utf-8')
          city=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/CityNewsActivity.java').read_text(encoding='utf-8')
          cache=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/CityNewsCache.java').read_text(encoding='utf-8')
          feed=Path('s-browser/app/src/main/java/com/saurabhsvision/sbrowser/CityNewsFeed.java').read_text(encoding='utf-8')
          assert 'HorizontalScrollView tabStrip' in main
          assert 'private void refreshTabStrip()' in main
          assert 'if(web.getParent()!=contentFrame)' in main
          assert 'web.onResume()' in main and 'tab.web.onPause()' in main
          assert 'private void showRecoveryActions()' in city
          assert 'CityNewsCache.load(' in city and 'CityNewsCache.save(' in city
          assert 'Saved, NOT live' in city
          assert 'MAX_CACHE_AGE_MS=12L*60L*60L*1000L' in cache
          assert 'java.net.SocketTimeoutException' in feed
          assert 'Saurabh Vision Learning App' in main
          print('PASS visible tab strip, WebView persistence, network recovery, explicit cached-news label')
          PY

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile S Browser debug APK
        working-directory: s-browser
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists and is signed
        shell: bash
        run: |
          set -euo pipefail
          APK="s-browser/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/S_Browser_v1.7.0_Smooth_Tabs_City_News_Fix_Beta.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-Browser-1.7.0-APK
          path: dist/S_Browser_v1.7.0_Smooth_Tabs_City_News_Fix_Beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta APK on GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="s-browser-v1.7.0-beta"
          FILE="dist/S_Browser_v1.7.0_Smooth_Tabs_City_News_Fix_Beta.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "S Browser 1.7 Beta — Smooth Tabs & City News Recovery" \
              --notes "S Browser 1.7 fixes the City News timeout user experience: one bounded retry for slow mobile RSS connections, clearly labeled locally cached dated articles if recent, quick Retry, Open live news in WebView, and Hindi/English switch. If no verified recent feed content is available, no fake headlines are invented. Browser now has a premium horizontal tab strip below the address bar showing Home, individual website tabs, close buttons, and + New; switching retains loaded WebViews without reloading. Gradient homepage, visible section divider headers and polished dark styling. Previous SAURABH VISION learning shortcut, 304-word dictionary, CG Jobs, Daily Assembly and news, bookmarks, notes and original S Browser icon preserved. Beta build has automated checks, but actual news availability depends on device internet and Google News; physical device testing required." \
              --prerelease
          fi
